name: Ajustar ficha produto adaptativa

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajustar-ficha-produto-adaptativa.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ajustar impressão adaptativa
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text()

          old='''    <div id="ficha-producao-produto-impressao">'''
          new='''    <div id="ficha-producao-produto-impressao" className={preparacoesExibicao.length > 1 || preparacoesExibicao.some((pc:any) => pc.itens.length > 5 || String(pc.prep.modo_preparo || "").split(/\\n|\\\\n/).length > 4) ? "ficha-produto-longa" : ""}>'''
          if old in s:
              s=s.replace(old,new,1)

          old='''      <section className="page-break-before">\n        <p className="text-lg font-black uppercase text-[#087443]">Montagem por tamanho</p>'''
          new='''      <section className={preparacoesExibicao.length > 1 || preparacoesExibicao.some((pc:any) => pc.itens.length > 5 || String(pc.prep.modo_preparo || "").split(/\\n|\\\\n/).length > 4) ? "mt-4 montagem-produto montagem-fluida" : "page-break-before montagem-produto"}>\n        <p className="text-lg font-black uppercase text-[#087443]">Montagem por tamanho</p>'''
          if old in s:
              s=s.replace(old,new,1)

          marker='#ficha-producao-produto-impressao h2{line-height:1.08}'
          css='''#ficha-producao-produto-impressao .montagem-fluida{break-before:auto!important;page-break-before:auto!important;margin-top:8pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa>section:nth-of-type(2){margin-top:6pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa>section:nth-of-type(2) .p-3{padding:3.5pt 4.5pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa>section:nth-of-type(2) .text-sm{font-size:9.1pt!important;line-height:1.14!important}\n#ficha-producao-produto-impressao.ficha-produto-longa>section:nth-of-type(2) .text-xs{font-size:8.4pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa>section:nth-of-type(3){margin-top:6pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa .montagem-produto{margin-top:7pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa .montagem-produto .py-2{padding-top:2.4pt!important;padding-bottom:2.4pt!important}\n#ficha-producao-produto-impressao.ficha-produto-longa .montagem-produto img{width:66%!important;max-height:300pt!important}\n'''
          if css not in s and marker in s:
              s=s.replace(marker,css+marker,1)

          old_js='''        if (inicioNaturalMontagem > alturaUtilA4Px * 0.92) montagem.classList.remove("page-break-before");'''
          new_js='''        if (inicioNaturalMontagem > alturaUtilA4Px * 0.70) {\n          montagem.classList.remove("page-break-before");\n          montagem.classList.add("montagem-fluida");\n        }\n        const alturaDuasPaginas = alturaUtilA4Px * 2;\n        const alturaConteudo = fichaProduto.scrollHeight;\n        if (alturaConteudo > alturaDuasPaginas * 1.02) {\n          const escala = Math.max(0.86, Math.min(1, (alturaDuasPaginas * 0.97) / alturaConteudo));\n          (fichaProduto as HTMLElement).style.zoom = String(escala);\n        }'''
          if old_js in s:
              s=s.replace(old_js,new_js,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(cozinha): manter fichas de produto compactas em duas paginas"
          git push origin main
