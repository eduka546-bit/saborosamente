name: Corrigir ficha impressao cozinha

on:
  push:
    paths:
      - '.github/workflows/corrigir-ficha-impressao.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir layout de impressao
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          # Impressao mais legivel.
          s = s.replace('body{font-family:Arial,sans-serif;color:#173a2d;margin:0;font-size:9px;line-height:1.2}', 'body{font-family:Arial,sans-serif;color:#173a2d;margin:0;font-size:10px;line-height:1.28}', 1)
          s = s.replace('.text-xs{font-size:8px}.text-sm{font-size:9px}.text-lg{font-size:11px}.text-xl{font-size:13px}.text-2xl{font-size:15px}', '.text-xs{font-size:8.5px}.text-sm{font-size:10px}.text-lg{font-size:12px}.text-xl{font-size:14px}.text-2xl{font-size:16px}', 1)

          # Cabecalho individual: forca duas colunas tambem na janela de impressao.
          s = s.replace('''        <div className="grid gap-4 md:grid-cols-[190px_1fr]">\n          <div className="rounded-xl bg-white p-2">{produto.imagem_url || produto.imagens?.[0] ? <img src={produto.imagem_url || produto.imagens?.[0]} alt={produto.nome} style={{ width: "100%", height: "135px", objectFit: "cover", borderRadius: "8px" }} /> : <div className="grid place-items-center" style={{ height: "135px" }}><ChefHat size={34} /></div>}</div>''', '''        <div className="grid gap-4" style={{ gridTemplateColumns: "145px 1fr", alignItems: "start" }}>\n          <div className="rounded-xl bg-white p-2" style={{ width: "145px", overflow: "hidden" }}>{produto.imagem_url || produto.imagens?.[0] ? <img src={produto.imagem_url || produto.imagens?.[0]} alt={produto.nome} style={{ width: "129px", height: "96px", objectFit: "contain", borderRadius: "8px", display: "block", margin: "0 auto" }} /> : <div className="grid place-items-center" style={{ height: "96px" }}><ChefHat size={34} /></div>}</div>''', 1)

          # Cabecalho da pagina de montagem individual.
          s = s.replace('''        <div className="mb-3 grid gap-4 md:grid-cols-[190px_1fr]">\n          <div className="rounded-xl border border-[#dbe7dd] bg-white p-2">{produto.imagem_url || produto.imagens?.[0] ? <img src={produto.imagem_url || produto.imagens?.[0]} alt={produto.nome} style={{ width: "100%", height: "145px", objectFit: "cover", borderRadius: "8px" }} /> : <div className="grid place-items-center" style={{ height: "145px" }}><ChefHat size={34} /></div>}</div>''', '''        <div className="mb-3 grid gap-4" style={{ gridTemplateColumns: "170px 1fr", alignItems: "start" }}>\n          <div className="rounded-xl border border-[#dbe7dd] bg-white p-2" style={{ width: "170px", overflow: "hidden" }}>{produto.imagem_url || produto.imagens?.[0] ? <img src={produto.imagem_url || produto.imagens?.[0]} alt={produto.nome} style={{ width: "154px", height: "116px", objectFit: "contain", borderRadius: "8px", display: "block", margin: "0 auto" }} /> : <div className="grid place-items-center" style={{ height: "116px" }}><ChefHat size={34} /></div>}</div>''', 1)

          # Tabela de montagem individual: colunas reais na impressao.
          s = s.replace('''          <div className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] gap-2 bg-[#edf5e6] px-3 py-2 text-xs font-bold uppercase text-[#527164]"><span>Componente pronto</span><span>200 g</span><span>300 g</span><span>400 g</span></div>''', '''          <div className="grid gap-2 bg-[#edf5e6] px-3 py-2 text-xs font-bold uppercase text-[#527164]" style={{ gridTemplateColumns: "minmax(220px,1fr) 90px 90px 90px", alignItems: "center" }}><span>Componente pronto</span><span>200 g</span><span>300 g</span><span>400 g</span></div>''', 1)
          s = s.replace('''          {(montagem as any[]).map((m: any, i: number) => <div key={m.id || i} className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] items-center gap-2 border-t border-[#e2ebe3] px-3 py-2 text-sm">''', '''          {(montagem as any[]).map((m: any, i: number) => <div key={m.id || i} className="grid items-center gap-2 border-t border-[#e2ebe3] px-3 py-2 text-sm" style={{ gridTemplateColumns: "minmax(220px,1fr) 90px 90px 90px" }}>''', 1)

          # Ficha total do dia: foto compacta sem virar banner.
          s = s.replace('''            <div className="mb-2 grid gap-3 md:grid-cols-[120px_1fr_auto] md:items-center">\n              <div className="rounded-xl bg-[#f4f7f4] p-1">{x.produto.imagem_url || x.produto.imagens?.[0] ? <img src={x.produto.imagem_url || x.produto.imagens?.[0]} alt={x.produto.nome} style={{ width: "100%", height: "82px", objectFit: "cover", borderRadius: "6px" }} /> : <div className="grid place-items-center" style={{ height: "82px" }}><ChefHat size={24} /></div>}</div>''', '''            <div className="mb-2 grid gap-3" style={{ gridTemplateColumns: "105px 1fr 55px", alignItems: "center" }}>\n              <div className="rounded-xl bg-[#f4f7f4] p-1" style={{ width: "105px", overflow: "hidden" }}>{x.produto.imagem_url || x.produto.imagens?.[0] ? <img src={x.produto.imagem_url || x.produto.imagens?.[0]} alt={x.produto.nome} style={{ width: "97px", height: "70px", objectFit: "contain", borderRadius: "6px", display: "block", margin: "0 auto" }} /> : <div className="grid place-items-center" style={{ height: "70px" }}><ChefHat size={24} /></div>}</div>''', 1)

          # Tabela da ficha total do dia tambem precisa manter as 4 colunas na impressao.
          old = 'className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] gap-2 bg-[#edf5e6] px-3 py-2 text-xs font-bold uppercase text-[#527164]"'
          new = 'className="grid gap-2 bg-[#edf5e6] px-3 py-2 text-xs font-bold uppercase text-[#527164]" style={{ gridTemplateColumns: "minmax(220px,1fr) 90px 90px 90px", alignItems: "center" }}'
          s = s.replace(old, new, 1)
          old = 'className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] items-center gap-2 border-t border-[#e2ebe3] px-3 py-2 text-sm"'
          new = 'className="grid items-center gap-2 border-t border-[#e2ebe3] px-3 py-2 text-sm" style={{ gridTemplateColumns: "minmax(220px,1fr) 90px 90px 90px" }}'
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): corrigir layout das fichas impressas"
          git push
