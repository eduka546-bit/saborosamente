name: Aplicar patch ficha paginas

on:
  push:
    paths:
      - '.github/workflows/aplicar-patch-ficha-paginas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_ficha_paginas_vinculos.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): compactar ficha e mostrar ingredientes sem vinculo"
          git push
