name: Adicionar montagem na impressao

on:
  push:
    paths:
      - '.github/workflows/adicionar-montagem-impressao.yml'
      - '.github/scripts/adicionar_montagem_impressao.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/adicionar_montagem_impressao.py
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "feat(cozinha): adicionar montagem por tamanho na segunda pagina"
          git push
