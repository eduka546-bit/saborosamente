name: Aplicar impressão idêntica à prévia aprovada

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-print-exact-preview-v2.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ajustar impressão para o padrão exato da prévia
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          s = s.replace(
            '@page{size:A4;margin:7mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#173a2d;margin:0;font-size:10.2px;line-height:1.32}',
            '@page{size:A4;margin:12mm 13mm 15mm 13mm;@bottom-left{content:"SaborosaMente - ficha operacional";font-family:Arial,sans-serif;font-size:7.5pt;color:#52695f}@bottom-right{content:"Página " counter(page);font-family:Arial,sans-serif;font-size:7.5pt;color:#52695f}}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#173a2d;margin:0;font-size:10.2pt;line-height:1.25}'
          )
          s = s.replace('.grid{display:grid;gap:4px}', '.grid{display:grid;gap:4pt}')
          s = s.replace('.gap-2,.gap-3,.gap-4,.gap-5{gap:4px}', '.gap-2,.gap-3,.gap-4,.gap-5{gap:4pt}')
          s = s.replace('.mb-2,.mb-3,.mb-4,.mb-5{margin-bottom:5px}', '.mb-2,.mb-3,.mb-4,.mb-5{margin-bottom:5pt}')
          s = s.replace('.mt-1,.mt-2,.mt-3,.mt-4{margin-top:4px}', '.mt-1,.mt-2,.mt-3,.mt-4{margin-top:4pt}')
          s = s.replace('.p-3,.p-4{padding:6px}', '.p-3,.p-4{padding:6pt}')
          s = s.replace('.px-3{padding-left:6px;padding-right:6px}', '.px-3{padding-left:6pt;padding-right:6pt}')
          s = s.replace('.py-1,.py-2{padding-top:3px;padding-bottom:3px}', '.py-1,.py-2{padding-top:3.5pt;padding-bottom:3.5pt}')
          s = s.replace('.rounded-xl,.rounded-2xl{border-radius:5px}', '.rounded-xl,.rounded-2xl{border-radius:4pt}')
          s = s.replace('.text-xs{font-size:9px}.text-sm{font-size:10.2px}.text-lg{font-size:12.5px}.text-xl{font-size:17px}.text-2xl{font-size:19px}', '.text-xs{font-size:9pt}.text-sm{font-size:10.2pt}.text-lg{font-size:12pt}.text-xl{font-size:17pt}.text-2xl{font-size:19pt}')
          s = s.replace('.page-break-before{break-before:auto!important;page-break-before:auto!important}', '.page-break-before{break-before:page!important;page-break-before:always!important}')

          marker = 'img{max-width:100%}'
          extra = '''img{max-width:100%}\n#ficha-producao-produto-impressao>section:first-child>div.mt-3{margin-left:12pt!important;margin-right:12pt!important}\n#ficha-producao-produto-impressao>section:nth-of-type(3)>.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:0!important}\n#ficha-producao-produto-impressao>section:nth-of-type(3)>.grid>div{background:#fff9ee!important}\n#ficha-producao-produto-impressao>section.page-break-before{padding-top:0!important}\n#ficha-producao-produto-impressao>section.page-break-before>div.mt-3{margin-top:8pt!important}\n#ficha-producao-produto-impressao>section.page-break-before img{width:76%!important;max-width:none!important;max-height:400pt!important}\n#ficha-producao-produto-impressao>section.page-break-before>div.mt-4:last-child{margin-top:14pt!important}\n#ficha-producao-produto-impressao>section.page-break-before>div.mt-4:last-child>div:first-child{width:95%!important;margin-bottom:8pt!important}\n#ficha-producao-produto-impressao h2{line-height:1.12}\n#ficha-producao-produto-impressao section>p.text-lg{margin-top:8pt;margin-bottom:5pt}\n#ficha-producao-dia-impressao h2{line-height:1.12}'''
          if extra not in s:
              s = s.replace(marker, extra, 1)

          s = s.replace('Os valores abaixo fecham exatamente 200 g, 300 g e 400 g após o ajuste de arredondamento.', 'Os valores abaixo fecham exatamente 200 g, 300 g e 400 g.')
          s = s.replace('Foto ampliada para facilitar a conferência de disposição, acabamento e apresentação.', 'Foto ampliada e centralizada para facilitar a conferência visual do produto pronto.')
          s = s.replace('style={{width:"52%",maxWidth:"430px",height:"auto",maxHeight:"400px",objectFit:"contain",objectPosition:"center center",display:"block",margin:"0 auto"}}', 'style={{width:"76%",maxWidth:"none",height:"auto",maxHeight:"400px",objectFit:"contain",objectPosition:"center center",display:"block",margin:"0 auto"}}')

          p.write_text(s)
      - name: Validar alterações
        run: |
          grep -q 'font-size:10.2pt' src/routes/cozinha.tsx
          grep -q 'break-before:page!important' src/routes/cozinha.tsx
          grep -q 'width:"76%"' src/routes/cozinha.tsx
      - name: Commit e remover workflow temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git rm .github/workflows/fix-print-exact-preview-v2.yml
          git commit -m 'fix(cozinha): igualar impressão à prévia aprovada'
          git push origin main
