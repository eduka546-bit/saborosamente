name: Padronizar ficha individual de montagem

on:
  push:
    paths:
      - '.github/workflows/padronizar-ficha-individual-montagem.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar ficha individual
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          anchor = '''      <section className="rounded-2xl bg-[#173a2d] p-4 text-white">\n        <p className="text-xs font-bold uppercase tracking-wide text-white/70">4. Ingredientes necessários / total a separar</p>\n        <div className="mt-3 grid gap-2 sm:grid-cols-2">{listaSeparar.map((x: any) => <div key={x.nome} className="flex items-center justify-between gap-3 rounded-xl bg-white/10 p-3"><p className="text-sm font-bold">{x.nome}</p><p className="text-right text-sm font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ") || "a gosto"}</p></div>)}</div>\n      </section>\n    </div>\n  </Janela>;\n}'''
          replacement = '''      <section className="rounded-2xl bg-[#173a2d] p-4 text-white">\n        <p className="text-xs font-bold uppercase tracking-wide text-white/70">4. Ingredientes necessários / total a separar</p>\n        <div className="mt-3 grid gap-2 sm:grid-cols-2">{listaSeparar.map((x: any) => <div key={x.nome} className="flex items-center justify-between gap-3 rounded-xl bg-white/10 p-3"><p className="text-sm font-bold">{x.nome}</p><p className="text-right text-sm font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ") || "a gosto"}</p></div>)}</div>\n      </section>\n\n      <section className="page-break-before">\n        <div className="mb-3 flex items-center justify-between gap-3">\n          <div>\n            <p className="text-sm font-black uppercase text-[#087443]">Montagem por tamanho</p>\n            <p className="text-xs text-[#62766b]">Referência de montagem de cada unidade de 200 g, 300 g e 400 g.</p>\n          </div>\n          <b className="text-xs text-[#173a2d]">{produto.nome}</b>\n        </div>\n        {!(montagem as any[]).length ? <Vazio texto="Montagem ainda não cadastrada para esta ficha." /> : <div className="rounded-2xl border border-[#dbe7dd] bg-white">\n          <div className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] gap-2 bg-[#edf5e6] px-3 py-2 text-xs font-bold uppercase text-[#527164]"><span>Componente pronto</span><span>200 g</span><span>300 g</span><span>400 g</span></div>\n          {(montagem as any[]).map((m: any, i: number) => <div key={m.id || i} className="grid grid-cols-[minmax(180px,1fr)_90px_90px_90px] items-center gap-2 border-t border-[#e2ebe3] px-3 py-2 text-sm"><div><b>{m.nome}</b>{m.observacao && !ehQB(m.observacao) && <p className="mt-1 text-xs text-[#62766b]">{textoCozinha(m.observacao)}</p>}</div><span>{n(m.gramas_200) > 0 ? `${arredondarProducao(m.gramas_200, "g").toLocaleString("pt-BR")} g` : (ehQB(m.observacao) ? "a gosto" : "—")}</span><span>{n(m.gramas_300) > 0 ? `${arredondarProducao(m.gramas_300, "g").toLocaleString("pt-BR")} g` : (ehQB(m.observacao) ? "a gosto" : "—")}</span><span>{n(m.gramas_400) > 0 ? `${arredondarProducao(m.gramas_400, "g").toLocaleString("pt-BR")} g` : (ehQB(m.observacao) ? "a gosto" : "—")}</span></div>)}\n        </div>}\n      </section>\n    </div>\n  </Janela>;\n}'''
          if anchor not in s:
              raise SystemExit('anchor ficha individual nao encontrado')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "feat(cozinha): adicionar montagem por tamanho na ficha individual"
          git push
