name: Integrar lista de compras
on:
  push:
    paths:
      - '.github/workflows/add-lista-compras.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar integração
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          s = s.replace('import { DemandaProducao } from "@/components/cozinha/DemandaProducao";\n', 'import { DemandaProducao } from "@/components/cozinha/DemandaProducao";\nimport { ListaCompras } from "@/components/cozinha/ListaCompras";\n')
          s = s.replace('type Aba = "producao" | "demanda" | "separar" | "ingredientes"', 'type Aba = "producao" | "demanda" | "separar" | "compras" | "ingredientes"')
          s = s.replace('{ id: "separar", label: "Separar hoje", icon: Salad },\n', '{ id: "separar", label: "Separar hoje", icon: Salad },\n    { id: "compras", label: "Lista de compras", icon: Package },\n')
          alvo = '''          {aba === "ingredientes" && (\n            <section>'''
          bloco = '''          {aba === "compras" && (\n            <ListaCompras\n              dataProducao={dataProducao}\n              necessidades={separar}\n              estoque={estoque as any[]}\n            />\n          )}\n          {aba === "ingredientes" && (\n            <section>'''
          if alvo not in s:
              raise SystemExit('ponto de insercao da aba compras nao encontrado')
          s = s.replace(alvo, bloco, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'feat(cozinha): integrar lista automatica de compras'
          git push
      - name: Remover workflow temporário
        run: |
          git rm .github/workflows/add-lista-compras.yml
          git commit -m 'chore: remover workflow temporário de compras'
          git push
