name: Dependency Refresh One Shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Run dependency refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Confirmar que xlsx não é usado no código
        run: |
          if grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs'             "(from|require\(|import\().*['\"]xlsx['\"]" src scripts supabase 2>/dev/null; then
            echo "xlsx ainda é usado no código; abortando remoção."
            exit 1
          fi

      - name: Remover xlsx e atualizar dependências compatíveis
        run: |
          bun remove xlsx
          bun update
          bun audit --audit-level=high

      - name: Commitar lockfile atualizado
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Sem mudanças de dependências."
            exit 0
          fi
          git config user.name "saborosamente-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Atualiza dependências vulneráveis após auditoria"
          git push origin HEAD:main
