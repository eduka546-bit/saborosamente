name: Adicionar acesso custos
on:
  push:
    paths:
      - '.github/workflows/add-link-custos.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/admin.index.tsx')
          s=p.read_text()
          alvo='{ label: "Relatórios", icon: BarChart2, href: "/admin/relatorios" },'
          novo=alvo+'\n                { label: "Custos e Margens", icon: TrendingUp, href: "/admin/custos" },'
          if alvo not in s: raise SystemExit('link relatorios nao encontrado')
          s=s.replace(alvo,novo,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.index.tsx
          git commit -m 'feat(admin): adicionar acesso ao relatorio de custos'
          git push
      - name: Limpeza
        run: |
          git rm .github/workflows/add-link-custos.yml
          git commit -m 'chore: remover workflow temporário de custos'
          git push
