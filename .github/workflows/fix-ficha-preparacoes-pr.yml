name: Fix ficha preparations PR
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove duplicated preparation sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text(encoding='utf-8')
          pattern=r'\n    \{abaFicha==="preparacoes" && <section>.*?</section>\}'
          blocks=re.findall(pattern,s,re.S)
          print('preparation blocks:',len(blocks))
          if len(blocks)>1:
              s=re.sub(pattern, lambda m: blocks[0], s, flags=re.S)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'fix(fichas): manter uma unica aba de preparacoes' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
