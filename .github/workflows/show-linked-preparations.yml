name: patch-ficha-modal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/show-linked-preparations.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text()
          old='''    {abaFicha==="ingredientes" && <section><p className="text-xs font-bold uppercase tracking-wide text-[#087443]">1. Ingredientes da receita</p><p className="mb-3 mt-1 text-sm text-[#62766b]">Informe as quantidades por tamanho. Perdas e ganhos são aplicados automaticamente na lista de produção.</p><div className="flex flex-col gap-2 sm:flex-row">'''
          new='''    {abaFicha==="ingredientes" && <section><p className="text-xs font-bold uppercase tracking-wide text-[#087443]">1. Ingredientes da receita</p><p className="mb-3 mt-1 text-sm text-[#62766b]">Informe as quantidades por tamanho. Perdas e ganhos são aplicados automaticamente na lista de produção.</p>{Array.isArray(receita?.preparacoes) && receita.preparacoes.length>0 && <div className="mb-4 rounded-xl border border-[#cfe1d3] bg-[#f5faf3] p-3"><p className="text-xs font-bold uppercase tracking-wide text-[#087443]">Preparações desta ficha</p><div className="mt-2 flex flex-wrap gap-2">{receita.preparacoes.map((p:any)=><span key={p.id || p.nome} className="rounded-full bg-white px-3 py-1.5 text-sm font-bold text-[#355445] shadow-sm">{p.nome}</span>)}</div><p className="mt-2 text-xs text-[#62766b]">As preparações ficam vinculadas à ficha e podem ser usadas na produção pelo seletor abaixo.</p></div>}<div className="flex flex-col gap-2 sm:flex-row">'''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'feat(fichas): show linked preparations in modal' || true
          git rm .github/workflows/show-linked-preparations.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push
