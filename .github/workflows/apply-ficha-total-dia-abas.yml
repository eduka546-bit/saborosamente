name: Apply ficha total dia abas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ficha-total-dia-abas.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_ficha_total_dia.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm scripts/patch_ficha_total_dia.py .github/workflows/apply-ficha-total-dia-abas.yml
          git commit -m "feat(cozinha): adicionar ficha total do dia com abas"
          git push
