name: Ajustar quantidades impressao
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajustar-quantidades-impressao.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar layout dos ingredientes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          old_prod = '''<div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{listaSeparar.map((x: any) => <div key={x.nome} className="rounded-xl bg-white/10 p-3"><p className="text-sm font-bold">{x.nome}</p><p className="mt-1 text-lg font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ")}</p></div>)}</div>'''
          new_prod = '''<div className="mt-3 grid gap-2 sm:grid-cols-2">{listaSeparar.map((x: any) => <div key={x.nome} className="flex items-center justify-between gap-3 rounded-xl bg-white/10 p-3"><p className="text-sm font-bold">{x.nome}</p><p className="text-right text-sm font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ") || "a gosto"}</p></div>)}</div>'''
          if old_prod not in s:
              raise SystemExit('bloco de ingredientes da ficha de produto nao encontrado')
          s = s.replace(old_prod, new_prod, 1)

          old_screen = '''{(separar as any[]).map((x: any) => <article key={`${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4">\n            <p className="font-black text-[#173a2d]">{x.item?.nome}</p>\n            <p className="mt-2 text-xl font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p>\n            {x.pratos?.length > 0 && <p className="mt-2 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}\n          </article>)}'''
          new_screen = '''{(separar as any[]).map((x: any) => <article key={`${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4">\n            <div className="flex items-center justify-between gap-3"><p className="font-black text-[#173a2d]">{x.item?.nome}</p><p className="text-right text-lg font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p></div>\n            {x.pratos?.length > 0 && <p className="mt-2 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}\n          </article>)}'''
          if old_screen not in s:
              raise SystemExit('bloco da lista de ingredientes do dia nao encontrado')
          s = s.replace(old_screen, new_screen, 1)

          old_print = '''{(separar as any[]).map((x: any) => <article key={`impressao-ing-${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4"><p className="font-black text-[#173a2d]">{x.item?.nome}</p><p className="mt-2 text-xl font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p>{x.pratos?.length > 0 && <p className="mt-2 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}</article>)}'''
          new_print = '''{(separar as any[]).map((x: any) => <article key={`impressao-ing-${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-3"><div className="flex items-center justify-between gap-3"><p className="font-black text-[#173a2d]">{x.item?.nome}</p><p className="text-right text-sm font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p></div>{x.pratos?.length > 0 && <p className="mt-1 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}</article>)}'''
          if old_print not in s:
              raise SystemExit('bloco impresso de ingredientes do dia nao encontrado')
          s = s.replace(old_print, new_print, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/ajustar-quantidades-impressao.yml
          git commit -m "fix(cozinha): mostrar quantidades ao lado dos ingredientes"
          git push
