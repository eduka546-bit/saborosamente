name: patch-ficha-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'eduka546-bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean ficha preparation tab
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text(encoding='utf-8')
          pattern=r'\n    \{abaFicha===\\"preparacoes\\" && <section>.*?</section>\}'
          matches=re.findall(pattern,s,re.S)
          if len(matches)>1:
              first=matches[0]
              s=re.sub(pattern, lambda m: first, s, flags=re.S)
          s=s.replace('<div className="mt-5"><Campo label="Modo de montagem / preparo"><textarea className={`${input} min-h-24`} value={modo} onChange={e=>setModo(e.target.value)} placeholder="Ex.: coloque arroz, frango, molho e finalize com brócolis."/></Campo></div>','',1)
          p.write_text(s,encoding='utf-8')
          print('blocos de preparações encontrados:', len(matches))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'fix(fichas): remover duplicacao da aba de preparacoes' || true
          git rm .github/workflows/patch-ficha-ui.yml || true
          git commit -m 'chore: remove temporary ficha ui workflow' || true
          git push || true
