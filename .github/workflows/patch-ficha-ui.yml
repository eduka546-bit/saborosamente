name: patch-ficha-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'eduka546-bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ficha preparation tab
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('type Aba = "producao" | "separar" | "ingredientes" | "marmitas" | "estoque" | "relatorio" | "etiquetas";', 'type Aba = "producao" | "separar" | "ingredientes" | "preparacoes" | "marmitas" | "estoque" | "relatorio" | "etiquetas";', 1)
          s=s.replace('{ id: "ingredientes", label: "Ingredientes", icon: Package },\n    { id: "marmitas", label: "Marmitas", icon: BookOpen },', '{ id: "ingredientes", label: "Ingredientes", icon: Package },\n    { id: "preparacoes", label: "Preparações", icon: CookingPot },\n    { id: "marmitas", label: "Marmitas", icon: BookOpen },', 1)
          s=s.replace('const [abaFicha, setAbaFicha] = useState<"ingredientes" | "montagem" | "resumo">("ingredientes");', 'const [abaFicha, setAbaFicha] = useState<"ingredientes" | "montagem" | "preparacoes" | "resumo">("ingredientes");', 1)
          old='<div className="mb-6 grid grid-cols-3 rounded-xl bg-[#e7eee8] p-1">{[["ingredientes","1. Ingredientes"],["montagem","2. Montagem"],["resumo","3. Custos e preparo"]].map(([id,label])='
          new='<div className="mb-6 grid grid-cols-4 rounded-xl bg-[#e7eee8] p-1">{[["ingredientes","1. Ingredientes"],["montagem","2. Montagem"],["preparacoes","3. Preparações"],["resumo","4. Custos"]].map(([id,label])='
          assert old in s
          s=s.replace(old,new,1)
          marker='    {abaFicha==="resumo" && <section>'
          assert marker in s
          prep='''    {abaFicha==="preparacoes" && <section><div className="mb-4"><p className="text-xs font-bold uppercase tracking-wide text-[#087443]">3. Preparações desta ficha</p><p className="mt-1 text-sm text-[#62766b]">Cada preparação aparece separadamente com seu rendimento e modo de preparo.</p></div>{!receita?.preparacoes?.length?<Vazio texto="Nenhuma preparação vinculada a esta ficha."/>:<div className="grid gap-4">{receita.preparacoes.map((ref:any)=>{const p=preparacoes.find((x:any)=>x.id===ref.id);return <article key={ref.id||ref.nome} className="rounded-2xl border border-[#dbe7dd] bg-white p-5"><div className="flex flex-wrap items-center justify-between gap-2"><h3 className="text-lg font-black">{p?.nome||ref.nome||"Preparação"}</h3><span className="rounded-full bg-[#edf5e6] px-2.5 py-1 text-[10px] font-black uppercase text-[#087443]">Preparação</span></div><p className="mt-1 text-sm text-[#62766b]">Rendimento: {n(p?.rendimento_final_g)>0?`${n(p.rendimento_final_g)} g`:"não informado"}</p><div className="mt-4 rounded-xl bg-[#f7fbf7] p-4"><p className="text-xs font-black uppercase tracking-wide text-[#527164]">Modo de preparo</p><div className="mt-2 whitespace-pre-line text-sm leading-6 text-[#355445]">{p?.modo_preparo||"Modo de preparo não informado."}</div></div></article>})}</div>}</section>\n'''
          s=s.replace(marker,prep+marker,1)
          s=s.replace('<div className="mt-5"><Campo label="Modo de montagem / preparo"><textarea className={`${input} min-h-24`} value={modo} onChange={e=>setModo(e.target.value)} placeholder="Ex.: coloque arroz, frango, molho e finalize com brócolis."/></Campo></div>','',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'feat(fichas): adicionar aba de preparacoes' || true
          git rm .github/workflows/patch-ficha-ui.yml || true
          git commit -m 'chore: remove temporary ficha ui workflow' || true
          git push || true
