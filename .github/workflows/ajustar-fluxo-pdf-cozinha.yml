name: Ajustar fluxo PDF cozinha

on:
  push:
    paths:
      - '.github/workflows/ajustar-fluxo-pdf-cozinha.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar paginação e unidades
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text(encoding='utf-8')

          # Deixa a montagem fluir naturalmente: se a página 1 estourar, o restante continua na página 2
          # e a montagem vem logo depois, em vez de forçar uma página intermediária quase vazia.
          s = s.replace('<section className="page-break-before">', '<section>', 2)

          # Quantidades em litro são exibidas como volume legível, não como "2.543 litro de leite".
          old = '''    if (ehQB(texto) || !n(item.quantidade)) return { tipo: "texto", valor: 0, exibicao: ehQB(texto) || !texto ? "a gosto" : textoCozinha(texto) };\n    const peso = /\\bkg\\b|\\bgr\\b|grama|\\bg\\b/i.test(texto);'''
          new = '''    if (ehQB(texto) || !n(item.quantidade)) return { tipo: "texto", valor: 0, exibicao: ehQB(texto) || !texto ? "a gosto" : textoCozinha(texto) };\n    const volumeLitros = /\\blitro(s)?\\b|\\bl\\b/i.test(texto);\n    if (volumeLitros) {\n      const litros = (n(item.quantidade) * fator) / 1000;\n      return { tipo: "texto", valor: 0, exibicao: `${litros.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 3 })} L` };\n    }\n    const peso = /\\bkg\\b|\\bgr\\b|grama|\\bg\\b/i.test(texto);'''
          if old not in s:
              raise SystemExit('trecho do interpretador nao encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): deixar PDF fluir e formatar litros"
          git push
