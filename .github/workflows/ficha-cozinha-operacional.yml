name: Ficha operacional da cozinha

on:
  push:
    paths:
      - '.github/workflows/ficha-cozinha-operacional.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tornar ficha operacional e confiavel
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          old = '''  janela.document.close();\n  janela.focus();\n  setTimeout(() => { janela.print(); janela.close(); }, 250);'''
          new = '''  janela.document.close();\n  janela.focus();\n  const imagens = Array.from(janela.document.images);\n  const prontas = imagens.map((img) => img.complete ? Promise.resolve() : new Promise<void>((resolve) => { img.onload = () => resolve(); img.onerror = () => resolve(); }));\n  Promise.race([Promise.all(prontas), new Promise((resolve) => setTimeout(resolve, 1500))]).then(() => {\n    setTimeout(() => { janela.print(); janela.close(); }, 150);\n  });'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''          itensPreparacao={itensPrep}\n          ingredientes={ingredientes as any[]}'''
          new = '''          itensPreparacao={itensPrep}\n          itensReceita={itensRec.get(rec.get(edit.id)?.id) || []}\n          ingredientes={ingredientes as any[]}'''
          if old not in s:
              raise SystemExit('props ficha individual nao encontrados')
          s = s.replace(old, new, 1)

          old = '''function FichaProducaoModal({ produto, dataProducao, producoes, receita, montagem, preparacoes, itensPreparacao, ingredientes, fechar }: any) {'''
          new = '''function FichaProducaoModal({ produto, dataProducao, producoes, receita, montagem, preparacoes, itensPreparacao, itensReceita = [], ingredientes, fechar }: any) {'''
          if old not in s:
              raise SystemExit('assinatura ficha individual nao encontrada')
          s = s.replace(old, new, 1)

          anchor = '''  const preparacoesCalculadas = preps.map((prep: any) => {'''
          insert = '''  const totalReceitaPorIngrediente = new Map<string, number>();\n  (itensReceita as any[]).filter((x: any) => x.ingrediente_id).forEach((x: any) => {\n    const total = n(x.gramas_200) * n(quantidades["200"]) + n(x.gramas_300) * n(quantidades["300"]) + n(x.gramas_400) * n(quantidades["400"]);\n    if (total > 0) totalReceitaPorIngrediente.set(x.ingrediente_id, (totalReceitaPorIngrediente.get(x.ingrediente_id) || 0) + total);\n  });\n\n  const preparacoesCalculadas = preps.map((prep: any) => {'''
          if anchor not in s:
              raise SystemExit('preparacoesCalculadas nao encontrado')
          s = s.replace(anchor, insert, 1)

          old = '''    const itens = (itensPreparacao.get(prep.id) || []).map((item: any) => ({\n      ...item,\n      ingrediente: porId.get(item.ingrediente_id),\n      calculado: interpretar(item, fator),\n    }));'''
          new = '''    const itens = (itensPreparacao.get(prep.id) || []).map((item: any) => {\n      const ingrediente = porId.get(item.ingrediente_id);\n      const fallbackExato = n(totalReceitaPorIngrediente.get(item.ingrediente_id));\n      const calculadoBase = interpretar(item, fator);\n      const usarFallback = !(n(prep.rendimento_final_g) > 0) || !(n(item.quantidade) > 0) || calculadoBase.tipo === "texto" || !(n(calculadoBase.valor) > 0);\n      const calculado = usarFallback && fallbackExato > 0\n        ? { tipo: "peso", valor: fallbackExato, exibicao: formatarQuantidadeProducao(fallbackExato, "g", ingrediente?.nome) }\n        : calculadoBase;\n      const pendente = usarFallback && !(fallbackExato > 0) && !(n(calculadoBase.valor) > 0);\n      return { ...item, ingrediente, calculado, pendente };\n    });'''
          if old not in s:
              raise SystemExit('map de itens de preparacao nao encontrado')
          s = s.replace(old, new, 1)

          old = '''  preparacoesCalculadas.forEach((pc: any) => pc.itens.forEach((item: any) => addTotal(item.ingrediente_id, item.ingrediente?.nome || "Ingrediente", item.calculado.tipo, item.calculado.valor, item.calculado.exibicao)));\n  diretos.forEach((d: any) => { if (d.ingrediente) addTotal(d.ingrediente.id, d.ingrediente.nome, "peso", d.bruto); });\n  const listaSeparar = Array.from(totais.values()).sort((a, b) => a.nome.localeCompare(b.nome));'''
          new = '''  if ((itensReceita as any[]).some((x: any) => x.ingrediente_id && totalReceitaPorIngrediente.get(x.ingrediente_id))) {\n    totalReceitaPorIngrediente.forEach((qtd: number, ingredienteId: string) => {\n      const ingrediente = porId.get(ingredienteId);\n      if (ingrediente) addTotal(ingredienteId, ingrediente.nome, "peso", qtd);\n    });\n  } else {\n    preparacoesCalculadas.forEach((pc: any) => pc.itens.forEach((item: any) => addTotal(item.ingrediente_id, item.ingrediente?.nome || "Ingrediente", item.calculado.tipo, item.calculado.valor, item.calculado.exibicao)));\n  }\n  diretos.forEach((d: any) => {\n    if (!d.ingrediente) return;\n    totais.delete(d.ingrediente.id);\n    addTotal(d.ingrediente.id, d.ingrediente.nome, "peso", d.bruto);\n  });\n  const listaSeparar = Array.from(totais.values()).sort((a, b) => a.nome.localeCompare(b.nome));'''
          if old not in s:
              raise SystemExit('lista separar nao encontrada')
          s = s.replace(old, new, 1)

          old = '''<span>{item.ingrediente?.nome || "Ingrediente"}</span><b>{item.calculado.exibicao}</b>'''
          new = '''<span>{item.ingrediente?.nome || "Ingrediente"}</span><b>{item.pendente ? `⚠ CADASTRAR QUANTIDADE${item.quantidade_texto ? ` · referência: ${textoCozinha(item.quantidade_texto)}` : ""}` : item.calculado.exibicao}</b>'''
          if old not in s:
              raise SystemExit('render item preparacao nao encontrado')
          s = s.replace(old, new, 1)

          s = s.replace('''<p className="text-xs font-black uppercase text-[#173a2d]">Sequência para a cozinha</p>''', '''<p className="text-xs font-black uppercase text-[#173a2d]">ORDEM DE PRODUÇÃO — siga nesta sequência</p>''', 1)
          s = s.replace('''<p className="text-sm"><b>2.</b> Faça cada preparação seguindo o modo de preparo e a quantidade recalculada.</p>''', '''<p className="text-sm"><b>2.</b> Faça cada preparação usando as quantidades exatas impressas abaixo. Se aparecer ⚠ CADASTRAR QUANTIDADE, não improvise: corrija a ficha antes de produzir.</p>''', 1)

          p.write_text(s)

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "feat(cozinha): transformar ficha impressa em ordem operacional"
          git push
