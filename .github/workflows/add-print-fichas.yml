name: Add print fichas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-print-fichas.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar impressao das fichas
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          marker = 'const input =\n  "w-full rounded-lg border border-[#cbd8ce] bg-white p-2.5 text-sm outline-none focus:border-[#087443]";\n'
          helper = '''const input =\n  "w-full rounded-lg border border-[#cbd8ce] bg-white p-2.5 text-sm outline-none focus:border-[#087443]";\nconst imprimirElemento = (id: string, titulo: string) => {\n  const elemento = document.getElementById(id);\n  if (!elemento) return toast.error("Não foi possível preparar a ficha para impressão.");\n  const janela = window.open("", "_blank", "width=1000,height=800");\n  if (!janela) return toast.error("Permita pop-ups para imprimir a ficha.");\n  janela.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${titulo}</title><style>\n    @page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#173a2d;margin:0;font-size:12px}h1,h2,h3,h4,p{margin-top:0}button{display:none!important}.grid{display:grid;gap:10px}.flex{display:flex}.flex-wrap{flex-wrap:wrap}.justify-between{justify-content:space-between}.items-center{align-items:center}.items-start{align-items:flex-start}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-5{gap:20px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-5{margin-bottom:20px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.p-3{padding:12px}.p-4{padding:16px}.px-3{padding-left:12px;padding-right:12px}.py-1{padding-top:4px;padding-bottom:4px}.py-2{padding-top:8px;padding-bottom:8px}.rounded-xl,.rounded-2xl{border-radius:8px}.border{border:1px solid #dbe7dd}.bg-white{background:#fff}.bg-\\[\\#edf5e6\\],.bg-\\[\\#f4f7f4\\],.bg-\\[\\#f4f8f4\\]{background:#f3f7f3}.bg-\\[\\#173a2d\\]{background:#fff!important;color:#173a2d!important;border:2px solid #173a2d}.text-white,.text-white\\/70{color:#173a2d!important}.text-\\[\\#087443\\]{color:#087443}.text-\\[\\#527164\\],.text-\\[\\#62766b\\]{color:#52695f}.font-bold{font-weight:700}.font-black{font-weight:800}.text-xs{font-size:10px}.text-sm{font-size:12px}.text-lg{font-size:16px}.text-xl{font-size:18px}.text-2xl{font-size:22px}.uppercase{text-transform:uppercase}.whitespace-pre-line{white-space:pre-line}article,section{break-inside:avoid;page-break-inside:avoid}img{max-width:100%}\n  </style></head><body>${elemento.innerHTML}</body></html>`);\n  janela.document.close();\n  janela.focus();\n  setTimeout(() => { janela.print(); janela.close(); }, 250);\n};\n'''
          if marker not in s:
              raise SystemExit('marcador input não encontrado')
          s = s.replace(marker, helper, 1)

          old = '  return <Janela titulo={`Ficha de produção total do dia — ${dataFmt}`} fechar={fechar}>\n    <div className="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">'
          new = '  return <Janela titulo={`Ficha de produção total do dia — ${dataFmt}`} fechar={fechar}>\n    <div className="mb-4 flex justify-end"><Botao leve onClick={() => imprimirElemento("ficha-producao-dia-impressao", `Ficha de produção do dia — ${dataFmt}`)}>Imprimir ficha do dia</Botao></div>\n    <div id="ficha-producao-dia-impressao">\n    <div className="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">'
          if old not in s:
              raise SystemExit('inicio ficha dia não encontrado')
          s = s.replace(old, new, 1)
          old = '    )}\n  </Janela>;\n}\n\nfunction FichaMontagemModal'
          new = '    )}\n    </div>\n  </Janela>;\n}\n\nfunction FichaMontagemModal'
          if old not in s:
              raise SystemExit('fim ficha dia não encontrado')
          s = s.replace(old, new, 1)

          old = '  return <Janela titulo={`Ficha de produção — ${produto.nome}`} fechar={fechar}>\n    <div className="grid gap-5">'
          new = '  return <Janela titulo={`Ficha de produção — ${produto.nome}`} fechar={fechar}>\n    <div className="mb-4 flex justify-end"><Botao leve onClick={() => imprimirElemento("ficha-producao-produto-impressao", `Ficha de produção — ${produto.nome}`)}>Imprimir ficha</Botao></div>\n    <div id="ficha-producao-produto-impressao" className="grid gap-5">'
          if old not in s:
              raise SystemExit('inicio ficha produto não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/add-print-fichas.yml
          git commit -m "feat(cozinha): imprimir fichas de producao"
          git push
