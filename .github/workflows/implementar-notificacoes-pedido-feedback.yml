name: Implementar notificacoes pedido e feedback

on:
  push:
    paths:
      - '.github/workflows/implementar-notificacoes-pedido-feedback.yml'
      - '.github/scripts/implementar_notificacoes_pedido_feedback.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/implementar_notificacoes_pedido_feedback.py
      - name: Publicar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.pedidos.tsx supabase/functions/whatsapp-notify/index.ts supabase/functions/whatsapp-agent/index.ts
          git commit -m "feat(whatsapp): automatizar status do pedido e feedback escrito"
          git push
