name: Aplicar padrão final de impressão v2

on:
  push:
    paths:
      - '.github/workflows/aplicar-padrao-impressao-cozinha-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch_padroes_impressao_cozinha.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "feat(cozinha): aplicar padrão aprovado às fichas impressas"
          git push
# execução final após remoção do workflow inválido
