name: Corrigir paginas e vinculos ficha

on:
  push:
    paths:
      - '.github/workflows/corrigir-paginas-e-vinculos-ficha.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir ficha impressa
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          # Detecta ingredientes numericos da receita que nao aparecem em nenhuma preparacao nem como componente direto da montagem.
          old = '''  const totais = new Map<string, { nome: string; peso: number; unidades: number; textos: string[] }>();'''
          new = '''  const idsEmPreparacoes = new Set(preparacoesCalculadas.flatMap((pc: any) => pc.itens.map((item: any) => item.ingrediente_id).filter(Boolean)));
  const idsDiretosMontagem = new Set(diretos.map((d: any) => d.ingrediente?.id).filter(Boolean));
  const ingredientesSemVinculo = (itensReceita as any[])
    .filter((x: any) => x.ingrediente_id && !idsEmPreparacoes.has(x.ingrediente_id) && !idsDiretosMontagem.has(x.ingrediente_id))
    .map((x: any) => ({
      ...x,
      ingrediente: porId.get(x.ingrediente_id),
      total: n(x.gramas_200) * n(quantidades["200"]) + n(x.gramas_300) * n(quantidades["300"]) + n(x.gramas_400) * n(quantidades["400"]),
    }))
    .filter((x: any) => x.total > 0);
  const totais = new Map<string, { nome: string; peso: number; unidades: number; textos: string[] }>();'''
          if old not in s:
              raise SystemExit('ancora totais nao encontrada')
          s = s.replace(old, new, 1)

          # Exibe claramente os ingredientes que poderiam desaparecer das instrucoes da cozinha.
          old = '''      <section>
        <p className="mb-3 text-sm font-black uppercase text-[#087443]">3. Ingredientes diretos / rendimento</p>'''
          new = '''      {ingredientesSemVinculo.length > 0 && <section className="rounded-2xl border border-amber-300 bg-amber-50 p-3">
        <p className="text-sm font-black uppercase text-amber-900">Atenção — ingredientes da receita ainda sem vínculo de execução</p>
        <p className="mt-1 text-xs text-amber-900">Estes itens constam com quantidade na ficha, mas ainda não estão ligados a uma preparação nem a um componente da montagem. <b>Não omitir.</b> A ficha técnica deve indicar onde entram.</p>
        <div className="mt-2 grid gap-1 sm:grid-cols-2">{ingredientesSemVinculo.map((x: any) => <div key={x.id} className="rounded-lg bg-white px-2 py-1.5 text-xs"><div className="flex justify-between gap-2"><b>{x.ingrediente?.nome || "Ingrediente"}</b><b>{formatarQuantidadeProducao(x.total, "g", x.ingrediente?.nome)}</b></div><p className="mt-1 text-[10px] text-[#62766b]">200 g: {n(x.gramas_200) > 0 ? `${arredondarProducao(x.gramas_200, "g")} g` : "QB"} · 300 g: {n(x.gramas_300) > 0 ? `${arredondarProducao(x.gramas_300, "g")} g` : "QB"} · 400 g: {n(x.gramas_400) > 0 ? `${arredondarProducao(x.gramas_400, "g")} g` : "QB"}</p></div>)}</div>
      </section>}
      <section>
        <p className="mb-3 text-sm font-black uppercase text-[#087443]">3. Ingredientes diretos / rendimento</p>'''
          if old not in s:
              raise SystemExit('secao diretos nao encontrada')
          s = s.replace(old, new, 1)

          # Compacta a lista total para impedir uma segunda pagina quase vazia antes da montagem.
          old = '''        <div className="mt-3 grid gap-2 sm:grid-cols-2">{listaSeparar.map((x: any) => <div key={x.nome} className="flex items-center justify-between gap-3 rounded-xl bg-white/10 p-3"><p className="text-sm font-bold">{x.nome}</p><p className="text-right text-sm font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ") || "a gosto"}</p></div>)}</div>'''
          new = '''        <div className="mt-2 grid gap-1 sm:grid-cols-3">{listaSeparar.map((x: any) => <div key={x.nome} className="flex items-center justify-between gap-2 rounded-lg bg-white/10 px-2 py-1.5"><p className="text-xs font-bold">{x.nome}</p><p className="text-right text-xs font-black">{[x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))].filter(Boolean).join(" · ") || "a gosto"}</p></div>)}</div>'''
          if old not in s:
              raise SystemExit('lista total nao encontrada')
          s = s.replace(old, new, 1)

          # Na impressao, tres colunas realmente precisam existir (Tailwind responsivo nao e aplicado na janela de print).
          old = '''.sm\\:grid-cols-3,.lg\\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}img{max-width:100%}'''
          new = '''.sm\\:grid-cols-3,.lg\\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.bg-amber-50{background:#fffbeb}.border-amber-300{border-color:#fcd34d}.text-amber-900{color:#78350f}.text-\\[10px\\]{font-size:8px}img{max-width:100%}'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): evitar pagina vazia e sinalizar ingredientes sem vinculo"
          git push
