name: Run WhatsApp media patch

on:
  push:
    paths:
      - '.github/workflows/run-whatsapp-media-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_whatsapp_media.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/whatsapp-agent/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore: integrate whatsapp media'
          git push
