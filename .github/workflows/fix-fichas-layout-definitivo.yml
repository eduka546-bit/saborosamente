name: Aplicar layout definitivo das fichas

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-fichas-layout-definitivo.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 .github/scripts/fix_fichas_layout_definitivo.py

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/fix-fichas-layout-definitivo.yml
          git rm .github/scripts/fix_fichas_layout_definitivo.py
          git commit -m "fix(cozinha): aplicar layout definitivo das fichas"
          git push origin main
