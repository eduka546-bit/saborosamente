name: Executar fluxo de produção da cozinha

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Executar patch das fichas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/aplicar-fluxo-producao-cozinha.yml').read_text()
          bloco = wf.split('      - name: Atualizar fichas de produção\n', 1)[1].split('      - name: Commit\n', 1)[0]
          bloco = bloco.split('        run: |\n', 1)[1]
          codigo = '\n'.join(l[10:] if l.startswith('          ') else l for l in bloco.splitlines())
          exec(compile(codigo, '<patch-fichas>', 'exec'))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(cozinha): consolidar produção do dia e simplificar fichas por produto"
          git push
