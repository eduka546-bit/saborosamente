name: Fix separacao ingredientes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-embalagens-receita.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir fallback da separacao
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('trecho da separacao nao encontrado')
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/fix-embalagens-receita.yml
          git commit -m "fix(cozinha): garantir ingredientes completos na separacao"
          git push
