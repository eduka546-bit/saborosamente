name: Fix embalagens receita
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-embalagens-receita.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir prop de embalagens
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          old = '''          ingredientes={ingredientes as any[]}
          preparacoes={preparacoes as any[]}
          itensPreparacao={itensPrep}'''
          new = '''          ingredientes={ingredientes as any[]}
          preparacoes={preparacoes as any[]}
          embalagens={embalagens as any[]}
          itensPreparacao={itensPrep}'''
          if old not in s:
              raise SystemExit('trecho da ReceitaModal não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/fix-embalagens-receita.yml
          git commit -m "fix(cozinha): aplicar embalagem e etiqueta no custo"
          git push
