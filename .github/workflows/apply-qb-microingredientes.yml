name: Apply QB microingredientes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-qb-microingredientes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          marker = 'const arredondarProducao = (v: unknown, unidade: "g" | "un" = "g") => {\n  const valor = Math.max(0, n(v));\n  if (!(valor > 0)) return 0;\n  const inteiro = Math.floor(valor);\n  const fracao = valor - inteiro;\n  const arredondado = fracao <= 0.2 + Number.EPSILON ? inteiro : inteiro + 1;\n  return unidade === "un" ? Math.max(1, arredondado) : arredondado;\n};\n'
          addition = 'const normalizarRegraCozinha = (v: unknown) => String(v || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase().trim();\nconst ehQB = (v: unknown) => /^(q\\.?b\\.?|qb|quanto baste|a gosto)$/i.test(normalizarRegraCozinha(v));\nconst textoCozinha = (v: unknown) => ehQB(v) ? "a gosto" : String(v || "").trim();\nconst ehMicroIngrediente = (nome: unknown) => /(^|\\b)(sal|salsinha|cebolinha|cheiro verde|tempero|pimenta|oregano|alho em po|paprica|noz moscada)(\\b|$)/i.test(normalizarRegraCozinha(nome));\nconst formatarQuantidadeProducao = (v: unknown, unidade: "g" | "un" = "g", nome: unknown = "") => {\n  const qtd = Math.max(0, n(v));\n  if (unidade === "un") return `${arredondarProducao(qtd, "un").toLocaleString("pt-BR")} un`;\n  if (ehMicroIngrediente(nome) && qtd > 0 && qtd < 1) return `${qtd.toLocaleString("pt-BR", { maximumFractionDigits: 3 })} g`;\n  return `${arredondarProducao(qtd, "g").toLocaleString("pt-BR")} g`;\n};\n'
          if marker not in s: raise SystemExit('helper base nao encontrado')
          s = s.replace(marker, marker + addition, 1)
          s = s.replace('const mapa = new Map<string, { id: string; quantidade: number; pratos: string[]; unidade: "g" | "un"; item: any }>();', 'const mapa = new Map<string, { id: string; quantidade: number; pratos: string[]; unidade: "g" | "un"; item: any; qb: boolean }>();', 1)
          old = '  const add = (id: string, q: number, nomePrato: string, unidade: "g" | "un") => {\n    const item = ing.get(id);\n    if (!item || !Number.isFinite(q) || q <= 0) return;\n    const chave = `${id}:${unidade}`;\n    const atual = mapa.get(chave) || { id, quantidade: 0, pratos: [], unidade, item };\n    atual.quantidade += q;\n    if (!atual.pratos.includes(nomePrato)) atual.pratos.push(nomePrato);\n    mapa.set(chave, atual);\n  };'
          new = '  const add = (id: string, q: number, nomePrato: string, unidade: "g" | "un", qb = false) => {\n    const item = ing.get(id);\n    if (!item || !Number.isFinite(q) || (q <= 0 && !qb)) return;\n    const chave = `${id}:${unidade}`;\n    const atual = mapa.get(chave) || { id, quantidade: 0, pratos: [], unidade, item, qb: false };\n    if (!qb) atual.quantidade += q;\n    atual.qb = atual.qb || qb;\n    if (!atual.pratos.includes(nomePrato)) atual.pratos.push(nomePrato);\n    mapa.set(chave, atual);\n  };'
          if old not in s: raise SystemExit('add nao encontrado')
          s = s.replace(old, new, 1)
          old = '          itens.forEach((item: any) => {\n            const qtdBase = n(item.quantidade);\n            if (!(qtdBase > 0)) return;\n            add(item.ingrediente_id, qtdBase * fator, prato.nome, unidadeItemPreparacao(item));\n          });'
          new = '          itens.forEach((item: any) => {\n            if (ehQB(item.quantidade_texto)) {\n              add(item.ingrediente_id, 0, prato.nome, unidadeItemPreparacao(item), true);\n              return;\n            }\n            const qtdBase = n(item.quantidade);\n            if (!(qtdBase > 0)) return;\n            add(item.ingrediente_id, qtdBase * fator, prato.nome, unidadeItemPreparacao(item));\n          });'
          if old not in s: raise SystemExit('itens prep nao encontrado')
          s = s.replace(old, new, 1)
          old = '.filter((x) => {\n          const saldo = (estoque as any[]).find((e) => e.ingrediente_id === x.id);\n          return n(saldo?.quantidade_atual) < n(x.quantidade);\n        })'
          new = '.filter((x) => {\n          if (x.qb) return false;\n          const saldo = (estoque as any[]).find((e) => e.ingrediente_id === x.id);\n          return n(saldo?.quantidade_atual) < n(x.quantidade);\n        })'
          s = s.replace(old, new, 1)
          old = '{x.unidade === "un"\n                          ? `${arredondarProducao(x.quantidade, "un").toLocaleString("pt-BR")} un`\n                          : `${arredondarProducao(x.quantidade, "g").toLocaleString("pt-BR")} g`}'
          new = '{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}'
          if old not in s: raise SystemExit('separar display nao encontrado')
          s = s.replace(old, new, 1)
          old = '<b>{x.unidade === "un" ? `${arredondarProducao(x.quantidade, "un").toLocaleString("pt-BR")} un` : formatPeso(x.quantidade)}</b>'
          new = '<b>{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</b>'
          if old not in s: raise SystemExit('dia total nao encontrado')
          s = s.replace(old, new, 1)
          old = '<div className="flex justify-between gap-3 text-sm"><span>{m.nome}</span><b>{formatPeso(m.total)}</b></div>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}'
          new = '<div className="flex justify-between gap-3 text-sm"><span>{m.nome}</span><b>{m.total > 0 ? formatPeso(m.total) : (ehQB(m.observacao) ? "a gosto" : textoCozinha(m.observacao))}</b></div>{m.observacao && !ehQB(m.observacao) && <p className="mt-1 text-xs text-[#62766b]">{textoCozinha(m.observacao)}</p>}'
          if old not in s: raise SystemExit('montagem dia nao encontrada')
          s = s.replace(old, new, 1)
          old = 'const fmt = (v: unknown) => n(v) > 0 ? `${arredondarProducao(v, "g").toLocaleString("pt-BR")} g` : "—";'
          new = 'const fmt = (v: unknown, observacao?: unknown) => n(v) > 0 ? `${arredondarProducao(v, "g").toLocaleString("pt-BR")} g` : (ehQB(observacao) ? "a gosto" : "—");'
          if old not in s: raise SystemExit('fmt montagem nao encontrado')
          s = s.replace(old, new, 1)
          old = '<div><b>{m.nome}</b>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}</div><span>{fmt(m.gramas_200)}</span><span>{fmt(m.gramas_300)}</span><span>{fmt(m.gramas_400)}</span>'
          new = '<div><b>{m.nome}</b>{m.observacao && !ehQB(m.observacao) && <p className="mt-1 text-xs text-[#62766b]">{textoCozinha(m.observacao)}</p>}</div><span>{fmt(m.gramas_200, m.observacao)}</span><span>{fmt(m.gramas_300, m.observacao)}</span><span>{fmt(m.gramas_400, m.observacao)}</span>'
          if old not in s: raise SystemExit('linha montagem nao encontrada')
          s = s.replace(old, new, 1)
          a = s.index('  const interpretar = (item: any, fator: number) => {')
          b = s.index('  const preparacoesCalculadas =', a)
          new_interpretar = '  const interpretar = (item: any, fator: number) => {\n    const texto = String(item.quantidade_texto || "").trim();\n    const ingrediente = porId.get(item.ingrediente_id) as any;\n    if (ehQB(texto) || !n(item.quantidade)) return { tipo: "texto", valor: 0, exibicao: ehQB(texto) || !texto ? "a gosto" : textoCozinha(texto) };\n    const peso = /\\bkg\\b|\\bgr\\b|grama|\\bg\\b/i.test(texto);\n    if (peso) {\n      const bruto = n(item.quantidade) * fator;\n      if (ehMicroIngrediente(ingrediente?.nome) && bruto > 0 && bruto < 1) return { tipo: "peso", valor: bruto, exibicao: formatarQuantidadeProducao(bruto, "g", ingrediente?.nome) };\n      const g = arredondarProducao(bruto, "g");\n      return { tipo: "peso", valor: g, exibicao: formatPeso(g) };\n    }\n    const semNumero = textoCozinha(texto.replace(/^\\s*[\\d.,]+\\s*/i, "").trim());\n    const un = arredondarProducao(n(item.quantidade) * fator, "un");\n    return { tipo: "un", valor: un, exibicao: `${un.toLocaleString("pt-BR")}${semNumero ? ` ${semNumero}` : " un"}` };\n  };\n'
          s = s[:a] + new_interpretar + s[b:]
          old = '{m.total > 0 ? formatPeso(m.total) : (m.observacao || "QB")}'
          new = '{m.total > 0 ? formatPeso(m.total) : (ehQB(m.observacao) || !m.observacao ? "a gosto" : textoCozinha(m.observacao))}'
          if old not in s: raise SystemExit('QB montagem producao nao encontrado')
          s = s.replace(old, new, 1)
          old = 'x.peso > 0 ? formatPeso(x.peso) : "", x.unidades > 0 ? `${x.unidades.toLocaleString("pt-BR", { maximumFractionDigits: 2 })} un` : "", ...x.textos'
          new = 'x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))'
          if old not in s: raise SystemExit('totais ficha nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/apply-qb-microingredientes.yml
          git commit -m "fix(cozinha): tratar QB como a gosto e preservar microgramas"
          git push
