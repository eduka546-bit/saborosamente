name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate checked lockfile for security update
        run: |
          bun install --lockfile-only
          echo '--- Dependency lock changes ---'
          git diff -- bun.lock | grep -E '^[-+] *"(shell-quote|source-map-js)"' || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verificar domínio público oficial
        run: |
          if grep -RIn --fixed-strings "saborosamente.vercel.app" src public supabase/functions 2>/dev/null; then
            echo "Referência pública antiga ao domínio da Vercel encontrada."
            exit 1
          fi

      # Execute os testes mesmo se houver vulnerabilidades conhecidas.
      # A auditoria continua obrigatória e pode reprovar o workflow.
      - name: Typecheck, tests and build
        run: bun run check

      - name: Auditar dependências
        if: success() || failure()
        run: bun audit --audit-level=high
