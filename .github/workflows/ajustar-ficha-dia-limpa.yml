name: Ajustar ficha do dia limpa

on:
  push:
    paths:
      - '.github/workflows/ajustar-ficha-dia-limpa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar layout aprovado
        run: python .github/scripts/ajustar_ficha_dia_limpa.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "feat(cozinha): aplicar prévia limpa da ficha de produção do dia"
          git push
