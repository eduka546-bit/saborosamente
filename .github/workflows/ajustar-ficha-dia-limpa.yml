name: Corrigir ficha do dia

on:
  push:
    paths:
      - '.github/workflows/ajustar-ficha-dia-limpa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir JSX e publicar
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text(encoding='utf-8')
          fi = s.find('function FichaProducaoDiaModal(')
          fj = s.find('function FichaMontagemModal(', fi)
          if fi < 0 or fj < 0:
              raise SystemExit('componente da ficha do dia não encontrado')
          bloco = s[fi:fj]
          bloco = bloco.replace('{totalDia}', '{totalMarmitas}')
          alvo = '    </div>\n  </Janela>;\n}\n\n'
          if alvo not in bloco:
              raise SystemExit('fechamento esperado não encontrado')
          bloco = bloco.replace(alvo, '    </div>\n    </div>\n  </Janela>;\n}\n\n', 1)
          s = s[:fi] + bloco + s[fj:]
          p.write_text(s, encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): corrigir ficha diária aprovada"
          git push
