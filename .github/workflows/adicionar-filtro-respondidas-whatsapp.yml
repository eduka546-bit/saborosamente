name: Adicionar filtro de conversas respondidas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Adicionar filtro Respondidas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/agente.tsx')
          s = p.read_text(encoding='utf-8')

          old = 'const [filterModo, setFilterModo] = useState<"todos" | "pendentes" | "ia" | "humano" | "campanhas">("pendentes");'
          new = 'const [filterModo, setFilterModo] = useState<"todos" | "pendentes" | "respondidas" | "ia" | "humano" | "campanhas">("pendentes");'
          if old not in s:
              raise SystemExit('Estado filterModo não encontrado')
          s = s.replace(old, new, 1)

          old = '''  const humanasCount = (conversas as any[]).filter((c) => c.modo === "humano").length;\n  const pendentesCount = (conversas as any[]).filter(precisaResponder).length;'''
          new = '''  const foiRespondida = (conversa: any) => {\n    const msgs = Array.isArray(conversa?.mensagens) ? conversa.mensagens : [];\n    const ultima = [...msgs].reverse().find((m: any) => m?.role !== "system");\n    return ultima?.role === "assistant";\n  };\n  const humanasCount = (conversas as any[]).filter((c) => c.modo === "humano").length;\n  const pendentesCount = (conversas as any[]).filter(precisaResponder).length;\n  const respondidasCount = (conversas as any[]).filter(foiRespondida).length;'''
          if old not in s:
              raise SystemExit('Contadores não encontrados')
          s = s.replace(old, new, 1)

          old = 'const matchModo = filterModo === "todos" || filterModo === "campanhas" || (filterModo === "pendentes" ? precisaResponder(c) : c.modo === filterModo);'
          new = 'const matchModo = filterModo === "todos" || filterModo === "campanhas" || (filterModo === "pendentes" ? precisaResponder(c) : filterModo === "respondidas" ? foiRespondida(c) : c.modo === filterModo);'
          if old not in s:
              raise SystemExit('matchModo não encontrado')
          s = s.replace(old, new, 1)

          old = '{(["pendentes", "todos", "humano", "ia", "campanhas"] as const).map((f) => ('
          new = '{(["pendentes", "respondidas", "todos", "humano", "ia", "campanhas"] as const).map((f) => ('
          if old not in s:
              raise SystemExit('Lista de filtros não encontrada')
          s = s.replace(old, new, 1)

          old = '''              {f === "pendentes"\n                ? `🔴 Falta responder (${pendentesCount})`\n                : f === "todos"\n                  ? "Tudo"'''
          new = '''              {f === "pendentes"\n                ? `🔴 Falta responder (${pendentesCount})`\n                : f === "respondidas"\n                  ? `✅ Respondidas (${respondidasCount})`\n                  : f === "todos"\n                    ? "Tudo"'''
          if old not in s:
              raise SystemExit('Rótulos de filtro não encontrados')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/agente.tsx
          git commit -m 'feat(whatsapp): adicionar filtro de conversas respondidas'
          git push origin main
