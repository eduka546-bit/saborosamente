name: Corrigir filtro respondidas WhatsApp

on:
  push:
    paths:
      - '.github/workflows/corrigir-filtro-respondidas-whatsapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir criterio de respondidas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/agente.tsx')
          s = p.read_text(encoding='utf-8')
          old = '  const foiRespondida = (conversa: any) => {\n    const msgs = Array.isArray(conversa?.mensagens) ? conversa.mensagens : [];\n    const ultima = [...msgs].reverse().find((m: any) => m?.role !== "system");\n    return ultima?.role === "assistant";\n  };'
          new = '  const foiRespondida = (conversa: any) => {\n    const msgs = Array.isArray(conversa?.mensagens) ? conversa.mensagens : [];\n    const uteis = msgs.filter((m: any) => m?.role !== "system");\n    const ultimoCliente = uteis.map((m: any) => m?.role).lastIndexOf("user");\n    if (ultimoCliente < 0) return false;\n    const ultima = uteis.at(-1);\n    // So entra em Respondidas quando o cliente falou e houve uma resposta depois.\n    // Isso tambem cobre conversas iniciadas por campanha depois que o cliente responde.\n    // Mensagem/campanha enviada por nos sem resposta do cliente nao conta.\n    return ultima?.role === "assistant" && ultimoCliente < uteis.length - 1;\n  };'
          if old not in s:
              raise SystemExit('Trecho foiRespondida nao encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/agente.tsx
          git commit -m 'fix(whatsapp): respondidas somente apos mensagem do cliente'
          git push origin main
