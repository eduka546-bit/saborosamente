name: Corrigir carrinhos abandonados
on:
  push:
    paths:
      - '.github/workflows/fix-carrinhos-abandonados.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir conversao e acesso admin
        shell: python
        run: |
          from pathlib import Path

          checkout = Path('src/routes/checkout.tsx')
          s = checkout.read_text()
          old = '''      setOrderId(order.id);\n      clear();'''
          new = '''      setOrderId(order.id);\n\n      // Carrinho abandonado: ao finalizar um pedido, marca a sessão como convertida\n      // antes de limpar o carrinho para não deixar uma venda concluída aparecendo como perdida.\n      try {\n        const abandonedSessionId =\n          typeof window !== "undefined"\n            ? localStorage.getItem("saborosamente.session_id")\n            : null;\n        if (abandonedSessionId) {\n          await supabase.rpc("update_abandoned_cart_state", {\n            p_session_id: abandonedSessionId,\n            p_status: "convertido",\n          });\n          localStorage.removeItem("saborosamente.abandon_coupon");\n        }\n      } catch (err) {\n        console.warn("[Checkout] não foi possível marcar carrinho como convertido:", err);\n      }\n\n      clear();'''
          if old not in s:
              raise SystemExit('âncora do checkout não encontrada')
          checkout.write_text(s.replace(old, new, 1))

          admin = Path('src/routes/admin.index.tsx')
          a = admin.read_text()
          old_admin = '''                { label: "Ver Pedidos", icon: ShoppingBag, href: "/admin/pedidos" },'''
          new_admin = '''                { label: "Ver Pedidos", icon: ShoppingBag, href: "/admin/pedidos" },\n                {\n                  label: "Carrinhos Abandonados",\n                  icon: ShoppingBag,\n                  href: "/admin/pedidos/carrinhos-abandonados",\n                },'''
          if old_admin not in a:
              raise SystemExit('âncora do admin não encontrada')
          admin.write_text(a.replace(old_admin, new_admin, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx src/routes/admin.index.tsx
          git rm -f .github/workflows/fix-separacao-ingredientes.yml || true
          git rm .github/workflows/fix-carrinhos-abandonados.yml
          git commit -m "fix(loja): completar recuperacao de carrinhos abandonados"
          git push
