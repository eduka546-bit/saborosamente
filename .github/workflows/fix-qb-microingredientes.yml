name: Fix QB e microingredientes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qb-microingredientes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar regras de QB e microingredientes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          old = '''const arredondarProducao = (v: unknown, unidade: "g" | "un" = "g") => {
  const valor = Math.max(0, n(v));
  if (!(valor > 0)) return 0;
  const inteiro = Math.floor(valor);
  const fracao = valor - inteiro;
  const arredondado = fracao <= 0.2 + Number.EPSILON ? inteiro : inteiro + 1;
  return unidade === "un" ? Math.max(1, arredondado) : arredondado;
};
'''
          new = '''const arredondarProducao = (v: unknown, unidade: "g" | "un" = "g") => {
  const valor = Math.max(0, n(v));
  if (!(valor > 0)) return 0;
  const inteiro = Math.floor(valor);
  const fracao = valor - inteiro;
  const arredondado = fracao <= 0.2 + Number.EPSILON ? inteiro : inteiro + 1;
  return unidade === "un" ? Math.max(1, arredondado) : arredondado;
};
const normalizarRegraCozinha = (v: unknown) => String(v || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase().trim();
const ehQB = (v: unknown) => /^(q\\.?b\\.?|qb|quanto baste|a gosto)$/i.test(normalizarRegraCozinha(v));
const textoCozinha = (v: unknown) => ehQB(v) ? "a gosto" : String(v || "").trim();
const ehMicroIngrediente = (nome: unknown) => /(^|\\b)(sal|salsinha|cebolinha|cheiro verde|tempero|pimenta|oregano|alho em po|paprica|noz moscada)(\\b|$)/i.test(normalizarRegraCozinha(nome));
const formatarQuantidadeProducao = (v: unknown, unidade: "g" | "un" = "g", nome: unknown = "") => {
  const qtd = Math.max(0, n(v));
  if (unidade === "un") return `${arredondarProducao(qtd, "un").toLocaleString("pt-BR")} un`;
  if (ehMicroIngrediente(nome) && qtd > 0 && qtd < 1) return `${qtd.toLocaleString("pt-BR", { maximumFractionDigits: 3 })} g`;
  return `${arredondarProducao(qtd, "g").toLocaleString("pt-BR")} g`;
};
'''
          if old not in s:
            raise SystemExit('helper arredondarProducao nao encontrado')
          s = s.replace(old, new, 1)

          s = s.replace(
            'const mapa = new Map<string, { id: string; quantidade: number; pratos: string[]; unidade: "g" | "un"; item: any }>();',
            'const mapa = new Map<string, { id: string; quantidade: number; pratos: string[]; unidade: "g" | "un"; item: any; qb: boolean }>();',
            1,
          )
          old_add = '''  const add = (id: string, q: number, nomePrato: string, unidade: "g" | "un") => {
    const item = ing.get(id);
    if (!item || !Number.isFinite(q) || q <= 0) return;
    const chave = `${id}:${unidade}`;
    const atual = mapa.get(chave) || { id, quantidade: 0, pratos: [], unidade, item };
    atual.quantidade += q;
    if (!atual.pratos.includes(nomePrato)) atual.pratos.push(nomePrato);
    mapa.set(chave, atual);
  };'''
          new_add = '''  const add = (id: string, q: number, nomePrato: string, unidade: "g" | "un", qb = false) => {
    const item = ing.get(id);
    if (!item || !Number.isFinite(q) || (q <= 0 && !qb)) return;
    const chave = `${id}:${unidade}`;
    const atual = mapa.get(chave) || { id, quantidade: 0, pratos: [], unidade, item, qb: false };
    if (!qb) atual.quantidade += q;
    atual.qb = atual.qb || qb;
    if (!atual.pratos.includes(nomePrato)) atual.pratos.push(nomePrato);
    mapa.set(chave, atual);
  };'''
          if old_add not in s:
            raise SystemExit('funcao add nao encontrada')
          s = s.replace(old_add, new_add, 1)

          old_item = '''          itens.forEach((item: any) => {
            const qtdBase = n(item.quantidade);
            if (!(qtdBase > 0)) return;
            add(item.ingrediente_id, qtdBase * fator, prato.nome, unidadeItemPreparacao(item));
          });'''
          new_item = '''          itens.forEach((item: any) => {
            if (ehQB(item.quantidade_texto)) {
              add(item.ingrediente_id, 0, prato.nome, unidadeItemPreparacao(item), true);
              return;
            }
            const qtdBase = n(item.quantidade);
            if (!(qtdBase > 0)) return;
            add(item.ingrediente_id, qtdBase * fator, prato.nome, unidadeItemPreparacao(item));
          });'''
          if old_item not in s:
            raise SystemExit('loop itens preparacao nao encontrado')
          s = s.replace(old_item, new_item, 1)

          s = s.replace(
            '.filter((x) => {\n          const saldo = (estoque as any[]).find((e) => e.ingrediente_id === x.id);\n          return n(saldo?.quantidade_atual) < n(x.quantidade);\n        })',
            '.filter((x) => {\n          if (x.qb) return false;\n          const saldo = (estoque as any[]).find((e) => e.ingrediente_id === x.id);\n          return n(saldo?.quantidade_atual) < n(x.quantidade);\n        })',
            1,
          )

          old_sep = '''{x.unidade === "un"
                          ? `${arredondarProducao(x.quantidade, "un").toLocaleString("pt-BR")} un`
                          : `${arredondarProducao(x.quantidade, "g").toLocaleString("pt-BR")} g`}'''
          new_sep = '''{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}'''
          if old_sep not in s:
            raise SystemExit('display separar hoje nao encontrado')
          s = s.replace(old_sep, new_sep, 1)

          old_day_total = '''<b>{x.unidade === "un" ? `${arredondarProducao(x.quantidade, "un").toLocaleString("pt-BR")} un` : formatPeso(x.quantidade)}</b>'''
          new_day_total = '''<b>{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</b>'''
          if old_day_total not in s:
            raise SystemExit('total separar do dia nao encontrado')
          s = s.replace(old_day_total, new_day_total, 1)

          old_day_mont = '''<div className="flex justify-between gap-3 text-sm"><span>{m.nome}</span><b>{formatPeso(m.total)}</b></div>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}'''
          new_day_mont = '''<div className="flex justify-between gap-3 text-sm"><span>{m.nome}</span><b>{m.total > 0 ? formatPeso(m.total) : (ehQB(m.observacao) ? "a gosto" : textoCozinha(m.observacao))}</b></div>{m.observacao && !ehQB(m.observacao) && <p className="mt-1 text-xs text-[#62766b]">{textoCozinha(m.observacao)}</p>}'''
          if old_day_mont not in s:
            raise SystemExit('montagem total dia nao encontrada')
          s = s.replace(old_day_mont, new_day_mont, 1)

          s = s.replace(
            'const fmt = (v: unknown) => n(v) > 0 ? `${arredondarProducao(v, "g").toLocaleString("pt-BR")} g` : "—";',
            'const fmt = (v: unknown, observacao?: unknown) => n(v) > 0 ? `${arredondarProducao(v, "g").toLocaleString("pt-BR")} g` : (ehQB(observacao) ? "a gosto" : "—");',
            1,
          )
          s = s.replace(
            '''<div><b>{m.nome}</b>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}</div><span>{fmt(m.gramas_200)}</span><span>{fmt(m.gramas_300)}</span><span>{fmt(m.gramas_400)}</span>''',
            '''<div><b>{m.nome}</b>{m.observacao && !ehQB(m.observacao) && <p className="mt-1 text-xs text-[#62766b]">{textoCozinha(m.observacao)}</p>}</div><span>{fmt(m.gramas_200, m.observacao)}</span><span>{fmt(m.gramas_300, m.observacao)}</span><span>{fmt(m.gramas_400, m.observacao)}</span>''',
            1,
          )

          old_interpretar = '''  const interpretar = (item: any, fator: number) => {
    const texto = String(item.quantidade_texto || "").trim();
    if (!n(item.quantidade)) return { tipo: "texto", valor: 0, exibicao: texto || "QB" };
    const peso = /\\bkg\\b|\\bgr\\b|grama|\\bg\\b/i.test(texto);
    if (peso) {
      const g = arredondarProducao(n(item.quantidade) * fator, "g");
      return { tipo: "peso", valor: g, exibicao: formatPeso(g) };
    }
    const semNumero = texto.replace(/^\\s*[\\d.,]+\\s*/i, "").trim();
    const un = arredondarProducao(n(item.quantidade) * fator, "un");
    return { tipo: "un", valor: un, exibicao: `${un.toLocaleString("pt-BR")}${semNumero ? ` ${semNumero}` : " un"}` };
  };'''
          new_interpretar = '''  const interpretar = (item: any, fator: number) => {
    const texto = String(item.quantidade_texto || "").trim();
    const ingrediente = porId.get(item.ingrediente_id) as any;
    if (ehQB(texto) || !n(item.quantidade)) return { tipo: "texto", valor: 0, exibicao: ehQB(texto) || !texto ? "a gosto" : textoCozinha(texto) };
    const peso = /\\bkg\\b|\\bgr\\b|grama|\\bg\\b/i.test(texto);
    if (peso) {
      const bruto = n(item.quantidade) * fator;
      if (ehMicroIngrediente(ingrediente?.nome) && bruto > 0 && bruto < 1) return { tipo: "peso", valor: bruto, exibicao: formatarQuantidadeProducao(bruto, "g", ingrediente?.nome) };
      const g = arredondarProducao(bruto, "g");
      return { tipo: "peso", valor: g, exibicao: formatPeso(g) };
    }
    const semNumero = textoCozinha(texto.replace(/^\\s*[\\d.,]+\\s*/i, "").trim());
    const un = arredondarProducao(n(item.quantidade) * fator, "un");
    return { tipo: "un", valor: un, exibicao: `${un.toLocaleString("pt-BR")}${semNumero ? ` ${semNumero}` : " un"}` };
  };'''
          if old_interpretar not in s:
            raise SystemExit('interpretar preparacao nao encontrado')
          s = s.replace(old_interpretar, new_interpretar, 1)

          s = s.replace(
            '''{m.total > 0 ? formatPeso(m.total) : (m.observacao || "QB")}''',
            '''{m.total > 0 ? formatPeso(m.total) : (ehQB(m.observacao) || !m.observacao ? "a gosto" : textoCozinha(m.observacao))}''',
            1,
          )
          s = s.replace(
            '''x.peso > 0 ? formatPeso(x.peso) : "", x.unidades > 0 ? `${x.unidades.toLocaleString("pt-BR", { maximumFractionDigits: 2 })} un` : "", ...x.textos''',
            '''x.peso > 0 ? formatarQuantidadeProducao(x.peso, "g", x.nome) : "", x.unidades > 0 ? formatarQuantidadeProducao(x.unidades, "un", x.nome) : "", ...x.textos.map((t: string) => textoCozinha(t))''',
            1,
          )

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/fix-qb-microingredientes.yml
          git commit -m "fix(cozinha): tratar QB como a gosto e preservar microgramas"
          git push
