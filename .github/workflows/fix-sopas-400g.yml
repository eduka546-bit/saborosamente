name: Fix sopas 400g
on:
  push:
    paths:
      - '.github/workflows/fix-sopas-400g.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cozinha para sopas 400g
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          # Produção: sopa só pode ser lançada em 400 g.
          ini = s.index('function ProducaoModal(')
          fim = s.index('function FichaProducaoDiaModal', ini)
          sec = s[ini:fim]
          alvo = '    [obs, setObs] = useState("");\n  return ('
          novo = '    [obs, setObs] = useState("");\n  const produtoSelecionado = marmitas.find((x: any) => x.id === produto);\n  const tamanhosDisponiveis = produtoSelecionado?.tipo_produto === "sopa" ? TAMANHOS.filter((t) => t.id === "400") : TAMANHOS;\n  return ('
          if alvo not in sec:
              raise SystemExit('estado do ProducaoModal não encontrado')
          sec = sec.replace(alvo, novo, 1)
          sec = sec.replace('{TAMANHOS.map((t) => (', '{tamanhosDisponiveis.map((t) => (', 1)
          s = s[:ini] + sec + s[fim:]

          # Ficha técnica: sopa exibe somente a coluna/tamanho 400 g.
          ini = s.index('function ReceitaModal(')
          fim = s.index('function TabelaCabecalho', ini)
          sec = s[ini:fim]
          alvo = '  const [abaFicha, setAbaFicha] = useState<"ingredientes" | "montagem" | "preparacoes" | "custos">("ingredientes");'
          novo = alvo + '\n  const tamanhosFicha = produto?.tipo_produto === "sopa" ? TAMANHOS.filter((t) => t.id === "400") : TAMANHOS;\n  const colunasFicha = produto?.tipo_produto === "sopa" ? "grid-cols-[minmax(220px,1fr)_120px_42px]" : "grid-cols-[minmax(220px,1fr)_120px_120px_120px_42px]";'
          if alvo not in sec:
              raise SystemExit('início da ReceitaModal não encontrado')
          sec = sec.replace(alvo, novo, 1)
          sec = sec.replace('{TAMANHOS.map(t=>', '{tamanhosFicha.map(t=>')
          sec = sec.replace('{TAMANHOS.map(t =>', '{tamanhosFicha.map(t =>')
          sec = sec.replace('<TabelaCabecalho titulo="Ingrediente">', '<TabelaCabecalho titulo="Ingrediente" tamanhos={tamanhosFicha}>')
          sec = sec.replace('<TabelaCabecalho titulo="Componente pronto">', '<TabelaCabecalho titulo="Componente pronto" tamanhos={tamanhosFicha}>')
          sec = sec.replace('className="grid grid-cols-[minmax(220px,1fr)_120px_120px_120px_42px] items-center gap-2 border-t border-[#e2ebe3] bg-white px-3 py-3"', 'className={`grid ${colunasFicha} items-center gap-2 border-t border-[#e2ebe3] bg-white px-3 py-3`}')
          sec = sec.replace('formatarGramas={formatarGramas}/>', 'formatarGramas={formatarGramas} tamanhos={tamanhosFicha}/>')
          s = s[:ini] + sec + s[fim:]

          # Cabeçalhos dinâmicos das fichas.
          old_start = s.index('function TabelaCabecalho(')
          old_end = s.index('function TabelaCustos(', old_start)
          s = s[:old_start] + '''function TabelaCabecalho({titulo,children,tamanhos=TAMANHOS}:any){
            const grid = `minmax(220px,1fr) ${tamanhos.map(() => "120px").join(" ")} 42px`;
            return <div className="mt-4 overflow-x-auto rounded-2xl border border-[#dbe7dd]"><div className="min-w-[480px]"><div className="grid gap-2 bg-[#edf5e6] px-3 py-3 text-xs font-bold uppercase tracking-wide text-[#527164]" style={{gridTemplateColumns:grid}}><span>{titulo}</span>{tamanhos.map((t:any)=><span key={t.id}>{t.label}</span>)}<span/></div>{children}</div></div>
          }
          ''' + s[old_end:]

          # Tabela de custos também respeita somente 400 g para sopas.
          old_start = s.index('function TabelaCustos(')
          old = s[old_start:]
          new = '''function TabelaCustos({linhas,ingredientes,nome,custoLinha,custoPrep,formatarGramas,tamanhos=TAMANHOS}:any){
            const grid = `minmax(220px,1fr) 100px ${tamanhos.map(() => "125px").join(" ")}`;
            const visiveis = linhas.filter((x:any)=>tamanhos.some((t:any)=>n(x[`gramas_${t.id}`]) > 0));
            return <div className="overflow-x-auto rounded-2xl border border-[#dbe7dd]"><div className="min-w-[520px]"><div className="grid gap-2 bg-[#edf5e6] px-3 py-3 text-xs font-bold uppercase tracking-wide text-[#527164]" style={{gridTemplateColumns:grid}}><span>Componente</span><span>Custo/kg</span>{tamanhos.map((t:any)=><span key={t.id}>{t.label}</span>)}</div>{visiveis.map((x:any,i:number)=>{const item=ingredientes.find((a:any)=>a.id===x.ingrediente_id);const custoKg=x.preparacao_id?valor(n(custoPrep(x.preparacao_id))*1000):item?valor(n(item.custo_por_kg)):"—";return <div key={i} className="grid gap-2 border-t border-[#e2ebe3] bg-white px-3 py-3 text-sm" style={{gridTemplateColumns:grid}}><b>{nome(x)}</b><span>{custoKg}</span>{tamanhos.map((t:any)=><span key={t.id}>{formatarQuantidadeProducao(x[`gramas_${t.id}`], item?.unidade_medida === "un" ? "un" : "g", item?.nome || nome(x))} · <b>{valor(custoLinha(x,t.id))}</b></span>)}</div>})}</div></div>
          }
          '''
          s = s[:old_start] + new
          p.write_text(s)

          q = Path('src/components/cozinha/SugestoesProducaoSinergia.tsx')
          u = q.read_text()
          alvo = '        tamanhos.forEach(({ id: tamanho }) => {'
          novo = '        const tamanhosDoProduto = p.tipo_produto === "sopa" ? tamanhos.filter(({ id }) => id === "400") : tamanhos;\n        tamanhosDoProduto.forEach(({ id: tamanho }) => {'
          if alvo not in u:
              raise SystemExit('loop de tamanhos das sinergias não encontrado')
          u = u.replace(alvo, novo, 1)
          alvo = '    const escolhas = tamanhos.map(({ id }) => ({ tamanho: id, quantidade: Math.max(0, Math.floor(n(quantidades[id]))) })).filter((x) => x.quantidade > 0);'
          novo = '    const tamanhosPermitidos = selecionada.produto?.tipo_produto === "sopa" ? tamanhos.filter(({ id }) => id === "400") : tamanhos;\n    const escolhas = tamanhosPermitidos.map(({ id }) => ({ tamanho: id, quantidade: Math.max(0, Math.floor(n(quantidades[id]))) })).filter((x) => x.quantidade > 0);'
          if alvo not in u:
              raise SystemExit('escolhas do modal de sinergia não encontradas')
          u = u.replace(alvo, novo, 1)
          # Modal: onde houver os três campos depois da seleção, restringe sopas a 400 g.
          marker = 'setQuantidades({ "200": "", "300": "", "400": "" });'
          pos = u.find(marker)
          tail = u[pos:] if pos >= 0 else u
          idx = tail.find('{tamanhos.map(')
          if idx >= 0:
              absolute = pos + idx
              u = u[:absolute] + '{(selecionada?.produto?.tipo_produto === "sopa" ? tamanhos.filter(({ id }) => id === "400") : tamanhos).map(' + u[absolute+len('{tamanhos.map('):]
          q.write_text(u)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/cozinha.tsx src/components/cozinha/SugestoesProducaoSinergia.tsx
          git rm .github/workflows/fix-sopas-400g.yml
          git commit -m "fix(cozinha): tratar sopas somente como 400g"
          git push