name: Print ingredientes fichas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/print-ingredientes-fichas.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garantir ingredientes na impressao
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          old_css = 'article,section{break-inside:avoid;page-break-inside:avoid}img{max-width:100%}'
          new_css = 'article,section{break-inside:avoid;page-break-inside:avoid}[data-screen-only]{display:none!important}.print-only{display:block!important}img{max-width:100%}'
          if old_css not in s:
              raise SystemExit('css de impressao nao encontrado')
          s = s.replace(old_css, new_css, 1)

          old_prod = '{abaDia === "producao" && (\n      !pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">'
          new_prod = '<div data-screen-only>\n    {abaDia === "producao" && (\n      !pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">'
          if old_prod not in s:
              raise SystemExit('inicio producao dia nao encontrado')
          s = s.replace(old_prod, new_prod, 1)

          old_ing_end = '    )}\n  </div>\n  </Janela>;\n}\n\nfunction FichaMontagemModal'
          new_ing_end = '''    )}\n    </div>\n\n    <div className="hidden print-only">\n      <section>\n        <p className="mb-3 text-sm font-black uppercase text-[#087443]">Produção do dia</p>\n        {!pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">\n          {pratos.map((x: any) => <article key={`print-${x.produto.id}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4">\n            <div className="flex justify-between gap-3"><div><h3 className="font-black">{x.produto.nome}</h3><p className="mt-1 text-sm text-[#62766b]">{TAMANHOS.filter(t => x.q[t.id] > 0).map(t => `${x.q[t.id]}×${t.label}`).join(" + ")}</p></div><b className="text-[#087443]">{x.total} un</b></div>\n            {x.montagemTotal.length > 0 && <div className="mt-3 grid gap-2 sm:grid-cols-2">{x.montagemTotal.map((m: any, i: number) => <div key={`${m.nome}-${i}`} className="flex justify-between gap-3 rounded-xl bg-[#f4f8f4] px-3 py-2 text-sm"><span>{m.nome}</span><b>{m.total > 0 ? formatPeso(m.total) : (ehQB(m.observacao) ? "a gosto" : textoCozinha(m.observacao))}</b></div>)}</div>}\n          </article>)}\n        </div>}\n      </section>\n      <section className="mt-5">\n        <p className="mb-3 text-sm font-black uppercase text-[#087443]">Ingredientes necessários do dia</p>\n        {!(separar as any[]).length ? <Vazio texto="Nenhum ingrediente calculado para a produção deste dia." /> : <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">\n          {(separar as any[]).map((x: any) => <article key={`print-ing-${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4"><p className="font-black text-[#173a2d]">{x.item?.nome}</p><p className="mt-2 text-xl font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p>{x.pratos?.length > 0 && <p className="mt-2 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}</article>)}\n        </div>}\n      </section>\n    </div>\n  </div>\n  </Janela>;\n}\n\nfunction FichaMontagemModal'''
          if old_ing_end not in s:
              raise SystemExit('fim ficha dia nao encontrado')
          s = s.replace(old_ing_end, new_ing_end, 1)

          s = s.replace('4. Total a separar', '4. Ingredientes necessários / total a separar', 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/print-ingredientes-fichas.yml
          git commit -m "fix(cozinha): incluir ingredientes nas fichas impressas"
          git push
