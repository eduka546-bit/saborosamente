name: Integrar contexto atendimento
on:
  push:
    paths:
      - .github/workflows/integrar-contexto-atendimento.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch_contexto_atendimento.py
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/agente.tsx
          git commit -m "feat(chatbot): integrar pedido carrinho e handoff no atendimento"
          git push
