name: Apply embalagens e custos totais
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-embalagens-custos.yml'
      - 'scripts/patch_embalagens_custos.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_embalagens_custos.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm scripts/patch_embalagens_custos.py .github/workflows/apply-embalagens-custos.yml
          git commit -m "feat(cozinha): integrar embalagens ao custo das fichas"
          git push
