name: Corrigir fluxo da impressão das fichas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-print-flow-v1.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remover quebra forçada de página na impressão
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()
          antigo = '.page-break-before{break-before:page;page-break-before:always}'
          novo = '.page-break-before{break-before:auto!important;page-break-before:auto!important}'
          if antigo not in s:
              raise SystemExit('Marcador de quebra forçada não encontrado')
          s = s.replace(antigo, novo, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'fix(cozinha): deixar impressão fluir sem página vazia'
          git push origin main
