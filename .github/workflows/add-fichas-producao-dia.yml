name: Add fichas producao dia e montagem
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-fichas-producao-dia.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cozinha
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          s = s.replace(
            '"producao" | "ficha-producao" | "ingrediente" | "preparacao" | "receita" | "transferencia" | "ajuste-estoque"',
            '"producao" | "ficha-producao" | "ficha-dia" | "ficha-montagem" | "ingrediente" | "preparacao" | "receita" | "transferencia" | "ajuste-estoque"'
          )

          old_acao = '''                acao={
                  <Botao onClick={() => abrir("producao")}>
                    <Plus size={18} />
                    Adicionar produção
                  </Botao>
                }'''
          new_acao = '''                acao={
                  <div className="flex flex-wrap gap-2">
                    <Botao leve onClick={() => abrir("ficha-dia")}>
                      <BookOpen size={18} />
                      Ficha de produção do dia
                    </Botao>
                    <Botao onClick={() => abrir("producao")}>
                      <Plus size={18} />
                      Adicionar produção
                    </Botao>
                  </div>
                }'''
          if old_acao not in s:
            raise SystemExit('acao producao nao encontrada')
          s = s.replace(old_acao, new_acao, 1)

          old_btn = '''                        <Botao leve onClick={() => abrir("ficha-producao", pr)}>
                          <BookOpen size={16} />
                          Ver ficha da produção
                        </Botao>'''
          new_btn = '''                        <Botao leve onClick={() => abrir("ficha-producao", pr)}>
                          <BookOpen size={16} />
                          Ver ficha da produção
                        </Botao>
                        <Botao leve onClick={() => abrir("ficha-montagem", pr)}>
                          <CookingPot size={16} />
                          Ver ficha de montagem
                        </Botao>'''
          if old_btn not in s:
            raise SystemExit('botao ficha producao nao encontrado')
          s = s.replace(old_btn, new_btn, 1)

          marker = '''      {modal === "transferencia" && ('''
          insert = '''      {modal === "ficha-dia" && (
        <FichaProducaoDiaModal
          dataProducao={dataProducao}
          producoes={producoes as any[]}
          produtos={produtos as any[]}
          receitas={receitas as any[]}
          montagemPorReceita={itensMontagem}
          separar={separar}
          fechar={() => setModal(null)}
        />
      )}
      {modal === "ficha-montagem" && edit && (
        <FichaMontagemModal
          produto={edit}
          dataProducao={dataProducao}
          producoes={(producoes as any[]).filter((p) => p.produto_id === edit.id)}
          receita={rec.get(edit.id)}
          montagem={itensMontagem.get(rec.get(edit.id)?.id) || []}
          fechar={() => setModal(null)}
        />
      )}
'''
          if marker not in s:
            raise SystemExit('marker transferencia nao encontrado')
          s = s.replace(marker, insert + marker, 1)

          function_marker = 'function FichaProducaoModal('
          funcoes = r'''function FichaProducaoDiaModal({ dataProducao, producoes, produtos, receitas, montagemPorReceita, separar, fechar }: any) {
  const produtoPorId = new Map((produtos as any[]).map((x: any) => [x.id, x]));
  const receitaPorProduto = new Map((receitas as any[]).map((x: any) => [x.produto_id, x]));
  const grupos = new Map<string, any[]>();
  (producoes as any[]).forEach((p: any) => grupos.set(p.produto_id, [...(grupos.get(p.produto_id) || []), p]));
  const pratos = Array.from(grupos.entries()).map(([produtoId, linhas]) => {
    const produto = produtoPorId.get(produtoId);
    const receita = receitaPorProduto.get(produtoId);
    const montagem = receita ? (montagemPorReceita.get(receita.id) || []) : [];
    const q = { "200": 0, "300": 0, "400": 0 } as Record<string, number>;
    linhas.forEach((p: any) => { if (q[p.gramatura] != null) q[p.gramatura] += n(p.quantidade_planejada); });
    const montagemTotal = montagem.map((m: any) => ({
      nome: m.nome,
      total: n(m.gramas_200) * q["200"] + n(m.gramas_300) * q["300"] + n(m.gramas_400) * q["400"],
      observacao: m.observacao || "",
    })).filter((m: any) => m.total > 0 || m.observacao);
    return { produto, q, montagemTotal, total: q["200"] + q["300"] + q["400"] };
  }).filter((x: any) => x.produto).sort((a: any, b: any) => a.produto.nome.localeCompare(b.produto.nome));
  const formatPeso = (g: number) => g >= 1000 ? `${(g / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 3 })} kg` : `${g.toLocaleString("pt-BR", { maximumFractionDigits: 1 })} g`;
  const dataFmt = new Date(`${dataProducao}T12:00:00`).toLocaleDateString("pt-BR");
  const totalMarmitas = pratos.reduce((s: number, x: any) => s + x.total, 0);
  return <Janela titulo={`Ficha de produção do dia — ${dataFmt}`} fechar={fechar}>
    <div className="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <div className="rounded-2xl bg-[#edf5e6] p-4"><p className="text-xs font-bold uppercase text-[#527164]">Total do dia</p><p className="mt-1 text-2xl font-black text-[#087443]">{totalMarmitas} unidades</p></div>
      <div className="rounded-2xl bg-[#f4f7f4] p-4"><p className="text-xs font-bold uppercase text-[#527164]">Sabores</p><p className="mt-1 text-2xl font-black text-[#173a2d]">{pratos.length}</p></div>
      <div className="rounded-2xl bg-[#f4f7f4] p-4"><p className="text-xs font-bold uppercase text-[#527164]">Itens para separar</p><p className="mt-1 text-2xl font-black text-[#173a2d]">{(separar as any[]).length}</p></div>
    </div>
    {!pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">
      {pratos.map((x: any) => <article key={x.produto.id} className="rounded-2xl border border-[#dbe7dd] bg-white p-4">
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div><h3 className="font-black">{x.produto.nome}</h3><p className="mt-1 text-sm text-[#62766b]">{TAMANHOS.filter(t => x.q[t.id] > 0).map(t => `${x.q[t.id]}×${t.label}`).join(" + ")}</p></div>
          <span className="rounded-full bg-[#edf5e6] px-3 py-1 text-sm font-black text-[#087443]">{x.total} un</span>
        </div>
        {x.montagemTotal.length > 0 && <div className="mt-4"><p className="mb-2 text-xs font-bold uppercase tracking-wide text-[#527164]">Montagem total deste prato</p><div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{x.montagemTotal.map((m: any, i: number) => <div key={`${m.nome}-${i}`} className="rounded-xl bg-[#f4f8f4] px-3 py-2"><div className="flex justify-between gap-3 text-sm"><span>{m.nome}</span><b>{formatPeso(m.total)}</b></div>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}</div>)}</div></div>}
      </article>)}
    </div>}
    {(separar as any[]).length > 0 && <div className="mt-6 rounded-2xl border border-[#cfe1d3] bg-[#f5faf3] p-4"><h3 className="font-black">Total a separar no dia</h3><p className="mt-1 text-sm text-[#62766b]">Consolidado de todas as produções lançadas para esta data.</p><div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{(separar as any[]).map((x: any) => <div key={`${x.id}-${x.unidade}`} className="flex justify-between gap-3 rounded-xl bg-white px-3 py-2 text-sm"><span>{x.item?.nome}</span><b>{x.unidade === "un" ? `${x.quantidade.toLocaleString("pt-BR", { maximumFractionDigits: 2 })} un` : formatPeso(x.quantidade)}</b></div>)}</div></div>}
  </Janela>;
}

function FichaMontagemModal({ produto, dataProducao, producoes, receita, montagem, fechar }: any) {
  const q = { "200": 0, "300": 0, "400": 0 } as Record<string, number>;
  (producoes as any[]).forEach((p: any) => { if (q[p.gramatura] != null) q[p.gramatura] += n(p.quantidade_planejada); });
  const dataFmt = new Date(`${dataProducao}T12:00:00`).toLocaleDateString("pt-BR");
  const fmt = (v: unknown) => n(v) > 0 ? `${n(v).toLocaleString("pt-BR", { maximumFractionDigits: 3 })} g` : "—";
  return <Janela titulo={`Ficha de montagem — ${produto.nome}`} fechar={fechar}>
    <div className="mb-5 rounded-2xl bg-[#edf5e6] p-4">
      <p className="text-xs font-bold uppercase tracking-wide text-[#087443]">Montagem por tamanho</p>
      <p className="mt-1 text-sm text-[#527164]">Referência para montar cada marmita individualmente. Produção de {dataFmt}: {TAMANHOS.filter(t => q[t.id] > 0).map(t => `${q[t.id]}×${t.label}`).join(" + ") || "nenhuma quantidade lançada"}.</p>
    </div>
    {!receita || !(montagem as any[]).length ? <Vazio texto="Esta ficha ainda não possui montagem cadastrada." /> : <div className="overflow-x-auto rounded-2xl border border-[#dbe7dd]"><div className="min-w-[720px]"><div className="grid grid-cols-[minmax(260px,1fr)_140px_140px_140px] gap-2 bg-[#edf5e6] px-4 py-3 text-xs font-bold uppercase tracking-wide text-[#527164]"><span>Componente pronto</span><span>200 g</span><span>300 g</span><span>400 g</span></div>{(montagem as any[]).map((m: any, i: number) => <div key={m.id || i} className="grid grid-cols-[minmax(260px,1fr)_140px_140px_140px] items-center gap-2 border-t border-[#e2ebe3] bg-white px-4 py-3"><div><b>{m.nome}</b>{m.observacao && <p className="mt-1 text-xs text-[#62766b]">{m.observacao}</p>}</div><span>{fmt(m.gramas_200)}</span><span>{fmt(m.gramas_300)}</span><span>{fmt(m.gramas_400)}</span></div>)}</div></div>}
    <div className="mt-5 grid gap-3 sm:grid-cols-3">{TAMANHOS.map(t => <div key={t.id} className="rounded-xl bg-[#f4f7f4] p-3"><p className="text-xs font-bold text-[#62766b]">Produzir {t.label}</p><p className="mt-1 text-lg font-black text-[#087443]">{q[t.id]} un</p></div>)}</div>
  </Janela>;
}

'''
          if function_marker not in s:
            raise SystemExit('function marker nao encontrado')
          s = s.replace(function_marker, funcoes + function_marker, 1)

          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/add-fichas-producao-dia.yml
          git commit -m "feat(cozinha): adicionar ficha do dia e ficha de montagem"
          git push
