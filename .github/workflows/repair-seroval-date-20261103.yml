name: One-time Seroval security fix
on:
  push:
    branches:
      - fix/pedidos-data-entrega-formato-br-20261103
    paths:
      - .github/workflows/repair-seroval-date-20261103.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedidos-data-entrega-formato-br-20261103
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Update locked transitive Seroval to patched version
        run: bun install
      - name: Build, typecheck and tests
        run: bun run check
      - name: Check dependencies for known security issues
        run: bun audit --audit-level=high
      - name: Commit updated dependency lockfile
        run: |
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(security): atualizar seroval para versão corrigida"
            git push origin HEAD:fix/pedidos-data-entrega-formato-br-20261103
          fi
