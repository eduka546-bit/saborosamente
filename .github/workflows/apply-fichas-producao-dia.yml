name: Apply fichas producao dia e montagem
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fichas-producao-dia.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_fichas_dia.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/apply-fichas-producao-dia.yml
          git rm -f .github/workflows/add-fichas-producao-dia.yml
          git rm scripts/patch_fichas_dia.py
          git commit -m "feat(cozinha): adicionar ficha do dia e ficha de montagem"
          git push
