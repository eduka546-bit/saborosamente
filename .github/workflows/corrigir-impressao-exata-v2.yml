name: Corrigir rendimento da cozinha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corrigir rendimento
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text()
          s=s.replace('''  const quantidadeComRendimento = (gramas: number, ingrediente: any) => {\n    if (ingrediente?.tipo_rendimento === "perda")\n      return gramas * (1 + n(ingrediente.quebra_percentual) / 100);\n    if (ingrediente?.tipo_rendimento === "ganho")\n      return gramas / n(ingrediente.fator_rendimento || 1);\n    return gramas;\n  };''','''  const quantidadeComRendimento = (gramas: number, ingrediente: any) => {\n    if (ingrediente?.tipo_rendimento === "perda") {\n      const perda = Math.min(99.999, Math.max(0, n(ingrediente.quebra_percentual))) / 100;\n      return gramas / (1 - perda);\n    }\n    if (ingrediente?.tipo_rendimento === "ganho") {\n      const fator = Math.max(0.000001, n(ingrediente.fator_rendimento || 1));\n      return gramas / fator;\n    }\n    return gramas;\n  };''')
          s=s.replace('''    if (ingrediente?.tipo_rendimento === "perda") bruto = m.total * (1 + n(ingrediente.quebra_percentual) / 100);\n    if (ingrediente?.tipo_rendimento === "ganho") bruto = m.total / n(ingrediente.fator_rendimento || 1);''','''    if (ingrediente?.tipo_rendimento === "perda") {\n      const perda = Math.min(99.999, Math.max(0, n(ingrediente.quebra_percentual))) / 100;\n      bruto = m.total / (1 - perda);\n    }\n    if (ingrediente?.tipo_rendimento === "ganho") bruto = m.total / Math.max(0.000001, n(ingrediente.fator_rendimento || 1));''')
          s=s.replace('''  const qCorreta = (g:number, item:any) => item?.tipo_rendimento==="perda" ? g*(1+n(item.quebra_percentual)/100) : item?.tipo_rendimento==="ganho" ? g/n(item.fator_rendimento||1) : g;''','''  const qCorreta = (g:number, item:any) => {\n    if (item?.tipo_rendimento === "perda") {\n      const perda = Math.min(99.999, Math.max(0, n(item.quebra_percentual))) / 100;\n      return g / (1 - perda);\n    }\n    if (item?.tipo_rendimento === "ganho") return g / Math.max(0.000001, n(item.fator_rendimento || 1));\n    return g;\n  };''')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(cozinha): corrigir cálculo de perda percentual"
          git push origin main
