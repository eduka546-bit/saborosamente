name: Finalizar notificacoes WhatsApp

on:
  push:
    paths:
      - '.github/workflows/finalizar-notificacoes-whatsapp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar melhorias
        shell: python
        run: |
          from pathlib import Path

          # Config UI: controlar se template Meta ja foi aprovado
          p = Path('src/routes/admin/config/whatsapp-notificacoes.tsx')
          s = p.read_text()
          s = s.replace('''  template_meta: string;\n};''', '''  template_meta: string;\n  template_aprovado: boolean;\n};''')
          s = s.replace('''    template_meta: "pedido_confirmado",\n  },''', '''    template_meta: "pedido_confirmado",\n    template_aprovado: false,\n  },''', 1)
          s = s.replace('''    template_meta: "pedido_saiu_entrega",\n  },''', '''    template_meta: "pedido_saiu_entrega",\n    template_aprovado: false,\n  },''', 1)
          s = s.replace('''    template_meta: "pedido_pronto_retirada",\n  },''', '''    template_meta: "pedido_pronto_retirada",\n    template_aprovado: false,\n  },''', 1)
          s = s.replace('''    template_meta: "feedback_pedido",\n  },''', '''    template_meta: "feedback_pedido",\n    template_aprovado: false,\n  },''', 1)
          old = '''                <div className="mt-4">\n                  <label className="text-xs font-bold uppercase text-gray-400">Nome do template Utility na Meta</label>\n                  <Input\n                    value={item.template_meta}\n                    onChange={(e) => setEtapa(etapa.key, { template_meta: e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_") })}\n                    placeholder="ex: pedido_confirmado"\n                    disabled={!item.ativo}\n                    className="mt-1"\n                  />\n                </div>'''
          new = '''                <div className="mt-4 grid gap-3 md:grid-cols-[1fr_auto] md:items-end">\n                  <div>\n                    <label className="text-xs font-bold uppercase text-gray-400">Nome do template Utility na Meta</label>\n                    <Input\n                      value={item.template_meta}\n                      onChange={(e) => setEtapa(etapa.key, { template_meta: e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_") })}\n                      placeholder="ex: pedido_confirmado"\n                      disabled={!item.ativo}\n                      className="mt-1"\n                    />\n                  </div>\n                  <label className="flex items-center gap-2 rounded-xl border px-3 py-2 text-xs font-semibold text-gray-600">\n                    <Switch\n                      checked={item.template_aprovado}\n                      onCheckedChange={(template_aprovado) => setEtapa(etapa.key, { template_aprovado })}\n                      disabled={!item.ativo}\n                    />\n                    Template aprovado\n                  </label>\n                </div>'''
          if old not in s:
              raise SystemExit('UI template anchor nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Tela de avaliacoes: feedback escrito sem distorcer media e com protocolo
          p = Path('src/routes/admin/avaliacoes.tsx')
          s = p.read_text()
          s = s.replace('''.select("*, pedidos(nome_cliente, created_at)")''', '''.select("*, pedidos(id, nome_cliente, created_at)")''')
          old = '''  const media = useMemo(() => {\n    if (!data.length) return 0;\n    return data.reduce((s: number, a: any) => s + (a.nota ?? 0), 0) / data.length;\n  }, [data]);'''
          new = '''  const notas = useMemo(() => data.filter((a: any) => Number.isInteger(a.nota) && a.nota >= 1 && a.nota <= 5), [data]);\n  const media = useMemo(() => {\n    if (!notas.length) return 0;\n    return notas.reduce((s: number, a: any) => s + Number(a.nota), 0) / notas.length;\n  }, [notas]);'''
          if old not in s:
              raise SystemExit('media avaliacoes anchor nao encontrado')
          s = s.replace(old, new, 1)
          s = s.replace('''              <p className="text-sm text-gray-500 mt-1">{data.length} avaliações</p>''', '''              <p className="text-sm text-gray-500 mt-1">{data.length} feedbacks · {notas.length} com nota</p>''')
          old = '''                    <div className="flex gap-0.5">\n                      {[1, 2, 3, 4, 5].map((n) => (\n                        <Star\n                          key={n}\n                          size={14}\n                          className={\n                            n <= (av.nota ?? 0)\n                              ? "fill-yellow-400 text-yellow-400"\n                              : "text-gray-200"\n                          }\n                        />\n                      ))}\n                    </div>'''
          new = '''                    {av.nota ? (\n                      <div className="flex gap-0.5">\n                        {[1, 2, 3, 4, 5].map((n) => (\n                          <Star key={n} size={14} className={n <= av.nota ? "fill-yellow-400 text-yellow-400" : "text-gray-200"} />\n                        ))}\n                      </div>\n                    ) : (\n                      <span className="text-[10px] font-bold uppercase rounded-full bg-green-50 text-green-700 px-2 py-1">Feedback escrito</span>\n                    )}'''
          if old not in s:
              raise SystemExit('stars card anchor nao encontrado')
          s = s.replace(old, new, 1)
          old = '''                  <p className="text-xs text-gray-400 mt-1">\n                    {format(new Date(av.created_at), "dd/MM/yyyy", { locale: ptBR })}\n                  </p>'''
          new = '''                  <p className="text-xs text-gray-400 mt-2">\n                    {av.pedido_id ? `Pedido #${String(av.pedido_id).slice(0, 8).toUpperCase()} · ` : ""}\n                    {format(new Date(av.created_at), "dd/MM/yyyy HH:mm", { locale: ptBR })}\n                  </p>'''
          if old not in s:
              raise SystemExit('data avaliacao anchor nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # whatsapp-notify: janela 24h + Utility fora da janela + config de ativacao
          p = Path('supabase/functions/whatsapp-notify/index.ts')
          s = p.read_text()
          anchor = '''async function sendWhatsApp(to: string, text: string) {'''
          if anchor not in s:
              raise SystemExit('sendWhatsApp anchor nao encontrado')
          insert_after = '''\nasync function sendWhatsAppTemplate(to: string, templateName: string, nome: string, protocolo: string) {\n  const url = `https://graph.facebook.com/${WHATSAPP_API_VERSION}/${WHATSAPP_PHONE_NUMBER_ID}/messages`;\n  const response = await fetch(url, {\n    method: "POST",\n    headers: { Authorization: `Bearer ${WHATSAPP_TOKEN}`, "Content-Type": "application/json" },\n    body: JSON.stringify({\n      messaging_product: "whatsapp",\n      to,\n      type: "template",\n      template: {\n        name: templateName,\n        language: { code: "pt_BR" },\n        components: [{\n          type: "body",\n          parameters: [\n            { type: "text", text: nome },\n            { type: "text", text: protocolo },\n          ],\n        }],\n      },\n    }),\n  });\n  if (!response.ok) {\n    const body = await response.text();\n    console.error("WhatsApp template error:", response.status, body);\n    throw new Error("Falha ao enviar template pelo WhatsApp");\n  }\n}\n\nasync function janela24hAberta(telefone: string): Promise<boolean> {\n  const digits = telefone.replace(/\\D/g, "");\n  const semPais = digits.startsWith("55") ? digits.slice(2) : digits;\n  const comPais = digits.startsWith("55") ? digits : `55${digits}`;\n  const variantes = [...new Set([digits, semPais, comPais])].filter(Boolean);\n  const { data } = await supabase\n    .from("whatsapp_conversas")\n    .select("mensagens,ultima_msg")\n    .in("telefone", variantes)\n    .order("ultima_msg", { ascending: false })\n    .limit(1)\n    .maybeSingle();\n  if (!data) return false;\n  const mensagens = Array.isArray(data.mensagens) ? data.mensagens : [];\n  const ultimaDoCliente = [...mensagens].reverse().find((m: any) => m?.role === "user" || m?.direction === "in");\n  const ts = ultimaDoCliente?.timestamp ?? ultimaDoCliente?.created_at ?? data.ultima_msg;\n  if (!ts) return false;\n  const diff = Date.now() - new Date(ts).getTime();\n  return Number.isFinite(diff) && diff >= 0 && diff <= 24 * 60 * 60 * 1000;\n}\n'''
          # append helpers immediately before image helper, avoiding function surgery
          image_anchor = '''/**\n * Envia imagem (para QR Code do PIX)\n */'''
          if image_anchor not in s:
              raise SystemExit('image helper anchor nao encontrado')
          s = s.replace(image_anchor, insert_after + '\n' + image_anchor, 1)

          old = '''    let templates: Record<string, string> = {};\n    try {\n      const { data: settings } = await supabase\n        .from("site_settings")\n        .select("parametros_loja")\n        .maybeSingle();\n      const raw = (settings?.parametros_loja as any)?.mensagens_whatsapp;\n      if (raw && typeof raw === "object") templates = raw;\n    } catch (e) {\n      console.warn("Falha ao buscar templates de mensagens (usando defaults):", e);\n    }\n\n    const metodoEntrega = String(pedido.metodo_entrega ?? "").toLowerCase();\n    const statusMensagem =\n      status_novo === "saiu para entrega" && metodoEntrega === "retirada"\n        ? "pronto para retirada"\n        : status_novo;\n\n    const mensagemObj = mensagemStatus(statusMensagem, pedido, isRecorrente, templates);'''
          new = '''    let templates: Record<string, string> = {};\n    let notificacoesConfig: any = {};\n    try {\n      const { data: settings } = await supabase\n        .from("site_settings")\n        .select("parametros_loja")\n        .maybeSingle();\n      const parametros = (settings?.parametros_loja as any) ?? {};\n      const raw = parametros.mensagens_whatsapp;\n      if (raw && typeof raw === "object") templates = raw;\n      notificacoesConfig = parametros.whatsapp_notificacoes ?? {};\n    } catch (e) {\n      console.warn("Falha ao buscar templates de mensagens (usando defaults):", e);\n    }\n\n    const metodoEntrega = String(pedido.metodo_entrega ?? "").toLowerCase();\n    let statusMensagem = status_novo;\n    if (["pendente", "pagamento_confirmado"].includes(status_novo)) statusMensagem = "pendente";\n    if (status_novo === "saiu para entrega" && metodoEntrega === "retirada") statusMensagem = "pronto para retirada";\n\n    const configKey =\n      statusMensagem === "pendente" ? "confirmado" :\n      statusMensagem === "saiu para entrega" ? "saiu_entrega" :\n      statusMensagem === "pronto para retirada" ? "pronto_retirada" :\n      statusMensagem === "entregue" ? "feedback" : null;\n\n    // O fluxo operacional acordado nao envia aviso de preparacao. Outros status\n    // legados continuam sem disparo automatico, exceto cancelamento se ja configurado.\n    if (statusMensagem === "preparando") {\n      return new Response(JSON.stringify({ ok: true, ignorada: true, motivo: "status sem notificacao" }), {\n        status: 200, headers: { "Content-Type": "application/json", ...corsHeaders },\n      });\n    }\n\n    const etapaConfig = configKey ? notificacoesConfig?.[configKey] : null;\n    if (etapaConfig?.ativo === false) {\n      return new Response(JSON.stringify({ ok: true, ignorada: true, motivo: "notificacao desativada" }), {\n        status: 200, headers: { "Content-Type": "application/json", ...corsHeaders },\n      });\n    }\n    if (etapaConfig?.texto && typeof etapaConfig.texto === "string") templates[statusMensagem] = etapaConfig.texto;\n\n    const mensagemObj = mensagemStatus(statusMensagem, pedido, isRecorrente, templates);'''
          if old not in s:
              raise SystemExit('config notify anchor nao encontrado')
          s = s.replace(old, new, 1)

          old = '''    // Envia mensagem\n    await sendWhatsApp(telWA, mensagemObj.texto);'''
          new = '''    // Dentro de 24h: texto normal. Fora da janela: somente template Utility\n    // explicitamente marcado como aprovado no Admin.\n    const protocoloEnvio = pedido.id.slice(0, 8).toUpperCase();\n    const nomeEnvio = pedido.nome_cliente?.split(" ")[0] ?? "cliente";\n    const janelaAberta = await janela24hAberta(telWA);\n    const templateMeta = String(etapaConfig?.template_meta ?? "").trim();\n    const templateAprovado = etapaConfig?.template_aprovado === true;\n\n    if (janelaAberta || !configKey) {\n      await sendWhatsApp(telWA, mensagemObj.texto);\n    } else if (templateMeta && templateAprovado) {\n      await sendWhatsAppTemplate(telWA, templateMeta, nomeEnvio, protocoloEnvio);\n    } else {\n      // Libera o claim para que o envio possa ser tentado novamente depois que\n      // o template for aprovado/configurado.\n      await supabase.from("whatsapp_notificacoes_enviadas").delete().eq("pedido_id", pedido_id).eq("status", statusMensagem);\n      notificationClaimed = false;\n      return new Response(JSON.stringify({ ok: false, aguardando_template: true, status: statusMensagem }), {\n        status: 200, headers: { "Content-Type": "application/json", ...corsHeaders },\n      });\n    }'''
          if old not in s:
              raise SystemExit('send message anchor nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/config/whatsapp-notificacoes.tsx src/routes/admin/avaliacoes.tsx supabase/functions/whatsapp-notify/index.ts
          git commit -m "feat(whatsapp): configurar Utility e feedback no admin"
          git push
