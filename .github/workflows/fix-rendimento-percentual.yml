name: Corrigir fórmula de rendimento percentual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rendimento-percentual.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corrigir fórmulas de rendimento
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/cozinha.tsx')
          s = p.read_text()

          old1 = '''  const quantidadeComRendimento = (gramas: number, ingrediente: any) => {
    if (ingrediente?.tipo_rendimento === "perda")
      return gramas * (1 + n(ingrediente.quebra_percentual) / 100);
    if (ingrediente?.tipo_rendimento === "ganho")
      return gramas / n(ingrediente.fator_rendimento || 1);
    return gramas;
  };'''
          new1 = '''  const quantidadeComRendimento = (gramas: number, ingrediente: any) => {
    if (ingrediente?.tipo_rendimento === "perda") {
      const perda = Math.min(99.999, Math.max(0, n(ingrediente.quebra_percentual))) / 100;
      return gramas / (1 - perda);
    }
    if (ingrediente?.tipo_rendimento === "ganho") {
      const fator = Math.max(0.000001, n(ingrediente.fator_rendimento || 1));
      return gramas / fator;
    }
    return gramas;
  };'''
          if old1 in s:
              s = s.replace(old1, new1, 1)

          old2 = '''    if (ingrediente?.tipo_rendimento === "perda") bruto = m.total * (1 + n(ingrediente.quebra_percentual) / 100);
    if (ingrediente?.tipo_rendimento === "ganho") bruto = m.total / n(ingrediente.fator_rendimento || 1);'''
          new2 = '''    if (ingrediente?.tipo_rendimento === "perda") {
      const perda = Math.min(99.999, Math.max(0, n(ingrediente.quebra_percentual))) / 100;
      bruto = m.total / (1 - perda);
    }
    if (ingrediente?.tipo_rendimento === "ganho") bruto = m.total / Math.max(0.000001, n(ingrediente.fator_rendimento || 1));'''
          if old2 in s:
              s = s.replace(old2, new2, 1)

          old3 = '''  const qCorreta = (g:number, item:any) => item?.tipo_rendimento==="perda" ? g*(1+n(item.quebra_percentual)/100) : item?.tipo_rendimento==="ganho" ? g/n(item.fator_rendimento||1) : g;'''
          new3 = '''  const qCorreta = (g:number, item:any) => {
    if (item?.tipo_rendimento === "perda") {
      const perda = Math.min(99.999, Math.max(0, n(item.quebra_percentual))) / 100;
      return g / (1 - perda);
    }
    if (item?.tipo_rendimento === "ganho") return g / Math.max(0.000001, n(item.fator_rendimento || 1));
    return g;
  };'''
          if old3 in s:
              s = s.replace(old3, new3, 1)

          if s == p.read_text():
              raise SystemExit('Nenhuma fórmula antiga encontrada para corrigir')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git commit -m "fix(cozinha): corrigir perda percentual em produção e montagem"
          git push origin main