name: Fix ficha preparations target
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true
      - name: Clean duplicated preparation sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text(encoding='utf-8')
          pattern=r'\{abaFicha==="preparacoes" && <section>.*?</section>\}'
          blocks=re.findall(pattern,s,re.S)
          print('preparation blocks:',len(blocks))
          if len(blocks)>1:
              keep=blocks[0]
              s=re.sub(pattern,'',s,flags=re.S)
              anchor='    {abaFicha==="resumo" && <section>'
              if anchor not in s:
                  raise SystemExit('costs anchor not found')
              s=s.replace(anchor,keep+'\n'+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/cozinha.tsx
          git commit -m 'fix(fichas): manter uma unica aba de preparacoes' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
