name: Adicionar exportacao PDF separar hoje

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adicionar-exportar-pdf-separar-hoje.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar exportacao PDF
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(cozinha): exportar Separar hoje em PDF"
          git push origin main
