name: Print ingredientes fichas v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/print-ingredientes-fichas-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir impressao
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/cozinha.tsx')
          s=p.read_text()
          css='article,section{break-inside:avoid;page-break-inside:avoid}img{max-width:100%}'
          if css in s:
              s=s.replace(css,'article,section{break-inside:avoid;page-break-inside:avoid}[data-screen-only]{display:none!important}.print-only{display:block!important}img{max-width:100%}',1)
          inicio='{abaDia === "producao" && (\n      !pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">'
          if inicio not in s:
              raise SystemExit('inicio nao encontrado')
          s=s.replace(inicio,'<div data-screen-only>\n    {abaDia === "producao" && (\n      !pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">',1)
          fim='''    )}\n    </div>\n  </Janela>;\n}\n\nfunction FichaMontagemModal'''
          if fim not in s:
              raise SystemExit('fim nao encontrado')
          bloco='''    )}\n    </div>\n\n    <div className="hidden print-only">\n      <section>\n        <p className="mb-3 text-sm font-black uppercase text-[#087443]">Produção do dia</p>\n        {!pratos.length ? <Vazio texto="Nenhuma produção lançada neste dia." /> : <div className="grid gap-4">\n          {pratos.map((x: any) => <article key={`impressao-prod-${x.produto.id}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4"><div className="flex justify-between gap-3"><div><h3 className="font-black">{x.produto.nome}</h3><p className="mt-1 text-sm text-[#62766b]">{TAMANHOS.filter(t => x.q[t.id] > 0).map(t => `${x.q[t.id]}×${t.label}`).join(" + ")}</p></div><b className="text-[#087443]">{x.total} un</b></div></article>)}\n        </div>}\n      </section>\n      <section className="mt-5">\n        <p className="mb-3 text-sm font-black uppercase text-[#087443]">Ingredientes necessários do dia</p>\n        {!(separar as any[]).length ? <Vazio texto="Nenhum ingrediente calculado para a produção deste dia." /> : <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">\n          {(separar as any[]).map((x: any) => <article key={`impressao-ing-${x.id}-${x.unidade}`} className="rounded-2xl border border-[#dbe7dd] bg-white p-4"><p className="font-black text-[#173a2d]">{x.item?.nome}</p><p className="mt-2 text-xl font-black text-[#087443]">{x.qb ? "a gosto" : formatarQuantidadeProducao(x.quantidade, x.unidade, x.item?.nome)}</p>{x.pratos?.length > 0 && <p className="mt-2 text-xs text-[#62766b]">Usado em: {x.pratos.join(" · ")}</p>}</article>)}\n        </div>}\n      </section>\n    </div>\n    </div>\n  </Janela>;\n}\n\nfunction FichaMontagemModal'''
          s=s.replace(fim,bloco,1)
          s=s.replace('4. Total a separar','4. Ingredientes necessários / total a separar',1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/cozinha.tsx
          git rm .github/workflows/print-ingredientes-fichas-v2.yml
          git rm -f .github/workflows/print-ingredientes-fichas.yml
          git commit -m "fix(cozinha): imprimir ingredientes necessarios nas fichas"
          git push
