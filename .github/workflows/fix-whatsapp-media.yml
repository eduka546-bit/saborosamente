name: Fix WhatsApp media integration

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-media.yml'
      - '.github/scripts/patch_whatsapp_media.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WhatsApp media
        run: python3 .github/scripts/patch_whatsapp_media.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/whatsapp-agent/index.ts src/routes/admin/agente.tsx .github/scripts/patch_whatsapp_media.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: integrate whatsapp media'
          git push
